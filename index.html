<head>

<title>Práctica para concursos · SRI y TCE</title>
<style>
:root{--bg:#f3f6fa;--card:#ffffff;--tx:#14202e;--mu:#5b6b7d;--br:#d6dee8;--ac:#0b5cab;--ac2:#0a4a8c;--acbg:#e6f0fb;--ok:#16794a;--okbg:#e4f5ec;--bad:#b3261e;--badbg:#fdeceb;--mid:#a86400;--midbg:#fff3df;--sh:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.06);--r:14px}

:root[data-theme="dark"]{--bg:#0e151d;--card:#17212c;--tx:#e8eef5;--mu:#9db0c3;--br:#2b394a;--ac:#5aa5ff;--ac2:#8cc0ff;--acbg:#16304d;--ok:#4cc38a;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1a19;--mid:#ffb54d;--midbg:#3a2a10;--sh:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}

#app{max-width:860px;margin:0 auto;padding:12px 14px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:1.55rem}h2{font-size:1.15rem}h3{font-size:1rem;margin:16px 0 8px}
p{margin:.4em 0}
.muted{color:var(--mu)}.small{font-size:.86rem}
.top{padding:6px 2px 10px}.top p{margin:2px 0 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:2px solid var(--br);border-radius:var(--r);padding:10px 12px;min-height:56px}
.tab b{font-size:.98rem}.tab small{color:var(--mu);font-size:.8rem}
.tab.on{border-color:var(--ac);background:var(--acbg)}
.sec-h{display:flex;flex-direction:column;gap:8px;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--br);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px}

.group{margin:14px 0}
.group>h3{margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;font-size:.78rem}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch;margin:8px 0}
.topic{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:11px 12px;min-height:60px;cursor:pointer}

.tt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tn{font-weight:600}.td{color:var(--mu);font-size:.84rem}.tm{color:var(--ac);font-size:.78rem}
.fbtn{border:1px dashed var(--ac);background:var(--acbg);color:var(--ac2);border-radius:var(--r);padding:8px 10px;min-width:92px;min-height:44px;font-size:.86rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.fbtn .fi{font-size:1.1rem;line-height:1}
.fbtn.has{border-style:solid}
.fbtn b{background:var(--ac);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;margin-left:2px}
.segs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.seg{border:1px solid var(--br);background:var(--card);border-radius:10px;padding:9px 14px;min-height:42px}
.seg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--br);background:var(--card);border-radius:12px;padding:11px 18px;min-height:46px;font-weight:600}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.primary:active{background:var(--ac2)}

.btn.big{width:100%;min-height:52px;font-size:1.05rem;margin-top:10px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}

.card .btn.ghost{width:100%;margin-top:8px}
.hist{list-style:none;margin:0;padding:0}.hist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--br);font-size:.9rem}.hist li:last-child{border:0}
.good{color:var(--ok)}.mid{color:var(--mid)}.low{color:var(--bad)}
.warn{background:var(--midbg);color:var(--mid);border-radius:10px;padding:8px 10px;font-size:.88rem}
.foot{color:var(--mu);font-size:.85rem;margin-top:18px;padding:0 2px}
/* Práctica */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}
.qn{font-weight:700}.timer{font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--br);border-radius:999px;padding:4px 12px}
.pbar{height:6px;border-radius:99px;background:var(--br);overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--br);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.qcat{font-size:.76rem;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:6px}

.ctx.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;line-height:1.7}
.opts{display:grid;gap:9px}
.opts.fig{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:2px solid var(--br);border-radius:12px;padding:11px 12px;min-height:50px;width:100%}
.opts.fig .opt{flex-direction:column;align-items:center;justify-content:center;gap:6px}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acbg);color:var(--ac2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.otx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt svg{display:block;margin:0 auto;max-width:100%;height:auto}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .ltr{background:var(--bad);color:#fff}

.fb.bad{background:var(--badbg);color:var(--tx);border-left:5px solid var(--bad)}
.fb p{margin:6px 0 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin:14px 0 8px}
.nav .btn{flex:1}

.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--br);display:inline-block}

.per{list-style:none;padding:0;margin:0}.per li{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:.92rem}
.bar{height:9px;background:var(--br);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:currentColor}
.bar i.good{background:var(--ok)}.bar i.mid{background:var(--mid)}.bar i.low{background:var(--bad)}
.rv{border-top:1px solid var(--br);padding:12px 0}.rv:first-of-type{border-top:0}

.rv .ansx svg{vertical-align:middle;max-width:90px;height:auto}
/* Figuras y tablas */
.figrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.fig{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:1.6rem}
.fig small{font-size:.8rem;color:var(--mu)}
.arrow{color:var(--mu);font-size:1.3rem}
.tbl{border-collapse:collapse;margin:0 auto;font-size:.92rem}
.tbl caption{caption-side:top;text-align:left;font-weight:600;padding-bottom:6px;color:var(--tx)}
.tbl th,.tbl td{border:1px solid var(--br);padding:5px 10px;text-align:center}
.tbl th{background:var(--acbg);color:var(--ac2)}
/* Usuario, meta 80 % y estadísticas */
.hello{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;background:var(--acbg);border-radius:12px;padding:8px 12px;margin:4px 0 8px}
.hb{display:flex;gap:14px}.lnk{background:none;border:0;color:var(--ac2);font-weight:600;padding:8px 2px;min-height:40px;text-decoration:underline}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.frow label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--mu)}
input[type=text],input[type=password]{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--ac);outline-offset:1px}
@media (max-width:420px){.frow{grid-template-columns:1fr}}
.donwrap{display:flex;justify-content:center;margin:2px 0 6px}
.donut{display:block}.donut.good{color:var(--ok)}.donut.mid{color:var(--mid)}.donut.low{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--okbg);color:var(--ok)}.pill.mid{background:var(--midbg);color:var(--mid)}.pill.low{background:var(--badbg);color:var(--bad)}.pill.none{background:var(--bg);color:var(--mu);border:1px solid var(--br)}
.pill.big{font-size:1.05rem;padding:6px 20px;letter-spacing:.06em}
.verdict{margin:4px 0}
.blist{list-style:none;padding:0;margin:8px 0 0}
.brow{padding:9px 0;border-bottom:1px solid var(--br)}.brow:last-child{border:0}
.bl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bn{font-weight:600;font-size:.94rem;min-width:0}
.bar2{position:relative;height:14px;background:var(--br);border-radius:99px;overflow:visible}
.bar2 i{display:block;height:100%;border-radius:99px;min-width:0;transition:width .4s}
.bar2 i.good{background:var(--ok)}.bar2 i.mid{background:var(--mid)}.bar2 i.low{background:var(--bad)}.bar2 i.none{background:transparent}
.bar2 .mk{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--tx);opacity:.75;border-radius:2px;text-decoration:none}
.bm{font-size:.82rem;color:var(--mu);margin-top:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--mu);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:50%;display:inline-block}.lg.good{background:var(--ok)}.lg.mid{background:var(--mid)}.lg.low{background:var(--bad)}
.mk2{width:3px;height:13px;background:var(--tx);opacity:.75;display:inline-block;border-radius:2px;text-decoration:none}
.guide{list-style:none;padding:0;margin:8px 0 0}.guide li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--br);overflow-wrap:anywhere}.guide li:last-child{border:0}.guide span{color:var(--mu);font-size:.86rem}
.src{margin:8px 0 0;font-size:.86rem;color:var(--ac2);background:var(--acbg);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.prio{margin:6px 0 0;padding-left:20px}.prio li{padding:3px 0}
.spark{position:relative;display:flex;align-items:flex-end;gap:8px;height:160px;padding:22px 4px 0;border-bottom:1px solid var(--br)}
.spark .sc{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.spark .sc i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0}
.spark .sc i.good{background:var(--ok)}.spark .sc i.mid{background:var(--mid)}.spark .sc i.low{background:var(--bad)}
.spark small{font-size:.72rem;color:var(--mu);position:absolute;left:0;right:0;text-align:center}
.spark .sl{position:absolute;left:0;right:0;border-top:2px dashed var(--tx);opacity:.5;text-decoration:none}
/* Acceso y cuenta */
.fl{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--mu);margin:10px 0}
.frow .fl{margin:0}
.chk{display:flex;align-items:flex-start;gap:10px;margin:10px 0;font-size:.92rem}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--ac);margin-top:1px}
.priv{margin:10px 2px}
.okmsg{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 12px;margin:6px 0;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.primary.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.hello small{margin-left:4px}
/* Panel de administrador */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--br);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:1.5rem;line-height:1.2}.kpi span{font-size:.8rem;color:var(--mu)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tscroll{overflow-x:auto;margin:8px 0}
.atable{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
.atable th{text-align:left;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--br);white-space:nowrap}
.atable td{padding:8px;border-bottom:1px solid var(--br)}
.atable tr.clk{cursor:pointer}.atable tr.clk:hover td{background:var(--acbg)}
.hlist{list-style:none;padding:0;margin:6px 0 0}
.hrow{display:grid;grid-template-columns:minmax(80px,.8fr) 1.4fr;gap:4px 10px;align-items:center;padding:6px 0;font-size:.9rem}
.hrow .hv{grid-column:1 / -1;color:var(--mu);font-size:.82rem;margin-top:-2px}
.bar2 i.none2{background:var(--ac)}
.ins{margin:6px 0 0;padding-left:20px}.ins li{padding:4px 0}
.sdays{display:flex;gap:8px;padding:4px 4px 0}.sdays span{flex:1;text-align:center;font-size:.72rem;color:var(--mu)}
.admlink{text-align:center;margin:18px 0 0}.admlink .lnk{font-size:.8rem;color:var(--mu)}
.cons{max-height:88vh;overflow:auto}
/* Diálogo de confirmación */
.dlg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(6,12,20,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg-b{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:18px;max-width:420px;width:100%}
.dlg-b p{margin:0 0 6px;font-size:1.02rem}
/* Modal */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(6,12,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--br)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.x{border:1px solid var(--br);background:transparent;border-radius:50%;width:40px;height:40px;flex:none}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.filebtn{cursor:pointer}
.status{background:var(--acbg);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.92rem;overflow-wrap:anywhere}
.flist{list-style:none;padding:0;margin:0}.flist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--br)}
.fn{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}.fn small{color:var(--mu)}
.help{margin:14px 0}.help summary{cursor:pointer;font-weight:600;padding:6px 0}
pre{background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:10px;overflow:auto;font-size:.82rem;white-space:pre-wrap}
@media (min-width:760px){
  #app{padding:20px 22px 60px}h1{font-size:1.8rem}
  .qt{font-size:1.2rem}.opts.fig{grid-template-columns:repeat(4,1fr)}
  .tabs{gap:12px}
}
@media (max-width:380px){.opts.fig{grid-template-columns:1fr 1fr}.trow{grid-template-columns:1fr}.fbtn{flex-direction:row;gap:6px;min-height:40px}}
</style>

<script>
(function(){'use strict';
/* ---- prelude.js ---- */
/* ===== Utilidades compartidas ===== */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function range(n){var r=[];for(var i=0;i<n;i++)r.push(i);return r;}
function gid(){return 'g'+Math.random().toString(36).slice(2,10);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function round2(n){return Math.round(n*100)/100;}
function fmtNum(n){return String(round2(n)).replace('.',',');}
function fmtMoney(n){
  var neg=n<0; n=Math.abs(round2(n)); var s=n.toFixed(2).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+'$'+s[0]+','+s[1];
}

/* ===== Declaración de preguntas estáticas =====
   Q(tema, pregunta, CORRECTA, distractor1, distractor2, distractor3, explicación)
   La correcta va primero; el orden se mezcla al mostrar. */
var QS=[]; var _cnt={};
function _id(cat){_cnt[cat]=(_cnt[cat]||0)+1;return cat+'-'+_cnt[cat];}
function Q(cat,q,ok,d1,d2,d3,exp){QS.push({id:_id(cat),cat:cat,text:q,opts:[ok,d1,d2,d3],ans:0,exp:exp||''});}
function QC(cat,ctx,q,ok,d1,d2,d3,exp){QS.push({id:_id(cat),cat:cat,ctx:ctx,text:q,opts:[ok,d1,d2,d3],ans:0,exp:exp||''});}
function Qa(cat,q,opts,ans,exp,ctx){QS.push({id:_id(cat),cat:cat,text:q,opts:opts,ans:ans,exp:exp||'',ctx:ctx||''});}

/* ---- gen.js ---- */
/* ===== Generadores de preguntas (ilimitadas) ===== */
var GENS={};
function GQ(cat,text,ok,dist,exp,extra){

function genOne(cat){

  for(var t=0;t<40;t++){var q=null;try{q=pick(list)();}catch(e){q=null;}
    if(q&&q.opts&&q.opts.length===4&&uniqueOpts(q.opts))return q;}
  return null;
}
function genMany(cat,n){
  var out=[],seen={},tries=0;
  while(out.length<n&&tries<n*6){tries++;var q=genOne(cat);if(!q)continue;var key=q.text+(q.ctx||'');if(seen[key])continue;seen[key]=1;out.push(q);}
  return out;
}

function validCedula(c){
  if(!/^\d{10}$/.test(c))return false;
  var p=+c.slice(0,2);if(!((p>=1&&p<=24)||p===30))return false;

Qa("ruc","En un RUC de 13 dígitos, si el tercer dígito es 9, corresponde a:",["Persona natural","Sociedad pública","Sociedad privada","Persona extranjera sin cédula"],2,"Tercer dígito menor a 6: persona natural. Tercer dígito 6: sociedad pública. Tercer dígito 9: sociedad privada.");
Qa("lrti","El ejercicio impositivo del Impuesto a la Renta va del:",["1 de abril al 31 de marzo","1 de enero al 31 de diciembre","1 de julio al 30 de junio","1 de febrero al 31 de enero"],1,"Corresponde al año calendario: del 1 de enero al 31 de diciembre.");
Qa("lrti","La tarifa general del Impuesto a la Renta para sociedades es de:",["15 %","22 %","25 %","28 %"],2,"La tarifa general es 25 %. La ley prevé tarifas distintas en casos particulares.");
Qa("iva","La tarifa general del IVA vigente en Ecuador es de:",["12 %","14 %","15 %","18 %"],2,"El IVA subió de 12 % a 15 % en abril de 2024. Según una circular del SRI de diciembre de 2025, se mantiene en 2026 mientras no haya un nuevo decreto. Verifica siempre la tarifa vigente en sri.gob.ec, porque este dato puede cambiar.");
Qa("iva","El IVA grava principalmente:",["Los sueldos de los empleados","La transferencia de bienes y la prestación de servicios","Únicamente las importaciones","Las herencias"],1,"Es un impuesto sobre el consumo: grava la transferencia de bienes, su importación y la prestación de servicios.");
Qa("ret","La retención en la fuente es:",["Un mecanismo de recaudación anticipada del impuesto","Una multa por declarar tarde","Un beneficio para pequeños contribuyentes","Un impuesto que solo pagan los bancos"],0,"El agente de retención descuenta un porcentaje al realizar un pago y lo entrega al SRI como pago anticipado del impuesto.");
Qa("comp","Una nota de crédito se emite, entre otros casos, para:",["Trasladar mercadería","Anular operaciones, aceptar devoluciones u otorgar descuentos posteriores a la factura","Cobrar intereses de mora","Registrar un contribuyente nuevo"],1,"La nota de crédito modifica a la baja una factura ya emitida. La nota de débito, en cambio, aumenta su valor (por ejemplo, por intereses de mora).");
Qa("comp","El documento que sustenta el traslado de bienes es:",["La guía de remisión","La nota de débito","El comprobante de retención","La liquidación de compra"],0,"La guía de remisión respalda el traslado de mercaderías entre lugares distintos.");
Qa("ct","El valor que se paga a un municipio por el servicio de recolección de basura es, en términos tributarios, una:",["Tasa","Contribución especial de mejoras","Exención","Multa"],0,"Las tasas son tributos que se pagan por un servicio público que se recibe.");
Qa("ct","El valor que pagan los propietarios beneficiados por el asfaltado de su calle, que aumenta el valor de sus inmuebles, es una:",["Tasa","Contribución especial de mejoras","Exención","Multa"],1,"La contribución especial de mejoras se cobra por obras públicas que benefician de forma directa a los propietarios.");
Qa("comp","Es un deber formal de los contribuyentes:",["Inscribirse en el RUC y emitir comprobantes de venta","Fijar las tarifas de los impuestos","Resolver los reclamos de otros contribuyentes","Ejercer la jurisdicción coactiva"],0,"Entre los deberes formales están inscribirse en los registros, emitir comprobantes, llevar contabilidad cuando corresponda y presentar declaraciones.");
Qa("sri","El mecanismo con el que el SRI hace efectivo el cobro de créditos tributarios vencidos es:",["La acción coactiva","La consulta tributaria","La devolución de impuestos","La exención"],0,"La Administración tributaria ejerce la jurisdicción coactiva para cobrar los créditos tributarios que no se pagaron.");
Qa("sri","El SRI fue creado en:",["1985","1997","2008","2012"],1,"Mediante la Ley 41 publicada el 2 de diciembre de 1997, como entidad técnica y autónoma.");
Qa("lrti","Entre los rubros de gastos personales que una persona natural puede deducir de su Impuesto a la Renta está:",["Educación","Multas de tránsito","Bienes de lujo","Apuestas"],0,"Los gastos personales deducibles incluyen, entre otros, vivienda, educación, salud, alimentación y vestimenta, dentro de los límites que fije la normativa de cada año.");
Qa("ct","La base imponible es:",["El valor sobre el cual se aplica la tarifa del tributo","La persona que debe declarar","El lugar donde se paga","La sanción por mora"],0,"Sobre la base imponible se aplica la tarifa para calcular el tributo.");
Qa("comp","¿Cuál de los siguientes es un documento complementario?",["Factura","Tiquete de máquina registradora","Nota de débito","Liquidación de compra"],2,"Los documentos complementarios son notas de crédito, notas de débito, guías de remisión y comprobantes de retención. Facturas, tiquetes y liquidaciones de compra son comprobantes de venta.");
Qa("sri","La determinación tributaria es el acto o conjunto de actos que sirve para establecer:",["Solo la fecha de pago","La existencia del hecho generador, el sujeto obligado, la base imponible y la cuantía del tributo","La sanción penal aplicable","La tarifa de los aranceles"],1,"Con la determinación se fija cuánto debe pagarse y quién debe hacerlo.");
Qa("const","¿Cuántas funciones del Estado reconoce la Constitución del Ecuador?",["3","4","5","6"],2,"Cinco: Ejecutiva, Legislativa, Judicial, de Transparencia y Control Social, y Electoral.");
Qa("const","Según la Constitución, ¿cuál NO es un principio de la administración pública?",["Eficacia","Transparencia","Centralización absoluta","Coordinación"],2,"El artículo 227 menciona: eficacia, eficiencia, calidad, jerarquía, desconcentración, descentralización, coordinación, participación, planificación, transparencia y evaluación.");
Qa("losep","Como regla general, el ingreso a un puesto en el servicio público se realiza mediante:",["Recomendación de un directivo","Concurso de méritos y oposición","Sorteo","Antigüedad familiar"],1,"La ley del servicio público establece el concurso de méritos y oposición para evaluar la idoneidad de los aspirantes y garantizar el libre acceso.");
Qa("coa","El ente rector de la contratación pública en Ecuador es:",["SRI","SERCOP","IESS","SENAE"],1,"El Servicio Nacional de Contratación Pública (SERCOP) es el organismo rector del Sistema Nacional de Contratación Pública.");
Qa("coa","La Contraloría General del Estado se encarga de:",["Aprobar las leyes","Controlar la utilización de los recursos estatales","Recaudar los impuestos","Administrar justicia"],1,"La Contraloría controla el uso de los recursos públicos y la actuación de las instituciones del Estado.");
Qa("const","La Contraloría General del Estado forma parte de la Función:",["Ejecutiva","Legislativa","Judicial","de Transparencia y Control Social"],3,"La Función de Transparencia y Control Social incluye, entre otros organismos, el Consejo de Participación Ciudadana y Control Social, la Defensoría del Pueblo, la Contraloría y las superintendencias.");
Qa("losep","La jornada ordinaria de trabajo en el servicio público regido por la LOSEP es de:",["6 horas diarias, 30 semanales","8 horas diarias, 40 semanales","9 horas diarias, 45 semanales","10 horas diarias, 50 semanales"],1,"La jornada ordinaria es de ocho horas diarias, cinco días a la semana, es decir 40 horas semanales.");
Qa("const","Según el artículo 1 de la Constitución, el Ecuador es un Estado:",["Federal y monárquico","Constitucional de derechos y justicia","Confesional","Confederado"],1,"Ecuador es un Estado constitucional de derechos y justicia, social, democrático, soberano, independiente, unitario, intercultural, plurinacional y laico.");
Qa("const","La Función Ejecutiva es ejercida por:",["La Asamblea Nacional","El Presidente de la República","La Corte Nacional de Justicia","El Consejo Nacional Electoral"],1,"El Presidente de la República ejerce la Función Ejecutiva y es jefe de Estado y de Gobierno.");
Qa("const","La Función Legislativa es ejercida por:",["La Presidencia","La Asamblea Nacional","La Contraloría","La Fiscalía"],1,"La Asamblea Nacional ejerce la Función Legislativa: expide leyes y fiscaliza.");
Qa("losep","Un servidor del SRI recibe de un contribuyente con un trámite pendiente un regalo costoso. Lo más adecuado es:",["Aceptarlo si nadie lo ve","Aceptarlo y agilizar el trámite","Rechazarlo y reportarlo por los canales institucionales","Guardarlo hasta terminar el trámite"],2,"Aceptar dádivas de quien tiene un asunto pendiente compromete la imparcialidad y puede constituir cohecho. Lo correcto es rechazarlo y reportarlo.");
Qa("losep","Un compañero te pide tu usuario y clave del sistema institucional «para ganar tiempo». Lo más adecuado es:",["Prestarle la clave solo por hoy","Negarte, porque las credenciales son personales e intransferibles","Compartirla si es de tu mismo equipo","Cambiarle el nombre de usuario"],1,"Las credenciales identifican a quien actúa en el sistema. Compartirlas te hace responsable de lo que otro haga con ellas.");
Qa("coa","Un ciudadano solicita información pública que no está reservada. Corresponde:",["Negarla por falta de tiempo","Entregarla dentro del plazo legal","Pedirle que justifique para qué la quiere","Entregarla solo si paga una tasa arbitraria"],1,"La información pública es un derecho de todas las personas y no se exige justificar el motivo de la solicitud.");
Qa("coa","El acto administrativo, según el Código Orgánico Administrativo, es:",["Una declaración unilateral de voluntad, en ejercicio de la función administrativa, que produce efectos jurídicos individuales o generales, siempre que se agote con su cumplimiento y de forma directa","Un acuerdo bilateral entre la administración y un particular que crea obligaciones recíprocas","Una opinión interna sin efectos jurídicos, emitida por cualquier servidor público","Una decisión judicial que resuelve un conflicto entre particulares"],0,"Es la definición del artículo 98 del COA. Si el efecto jurídico es general y no se agota con su cumplimiento, se trata de un acto normativo de carácter administrativo (artículo 128).");
Qa("coa","En el sector público, los servidores solo pueden hacer lo que la ley les faculta. Esto se relaciona con el principio de:",["Legalidad","Autonomía de la voluntad","Libre iniciativa","Informalidad"],0,"La Constitución (artículo 226) dispone que las instituciones y sus servidores ejercerán solamente las competencias y facultades que les sean atribuidas.");
Qa("const","Según la Constitución, es un deber de las ecuatorianas y los ecuatorianos:",["Pagar los tributos establecidos por la ley","Pertenecer a un partido político","Ejercer un cargo público","Portar armas"],0,"Entre los deberes y responsabilidades del artículo 83 está pagar los tributos establecidos por la ley.");
Qa("const","Según el artículo 425 de la Constitución, ¿qué norma ocupa el lugar inmediatamente inferior a la Constitución en el orden jerárquico?",["Las leyes orgánicas","Los tratados y convenios internacionales","Los decretos y reglamentos","Las ordenanzas distritales"],1,"El orden es: la Constitución; los tratados y convenios internacionales; las leyes orgánicas; las leyes ordinarias; las normas regionales y las ordenanzas distritales; los decretos y reglamentos; las ordenanzas; los acuerdos y las resoluciones; y los demás actos y decisiones de los poderes públicos.");
Qa("const","Solo por iniciativa de la Función Ejecutiva y mediante ley se pueden establecer, modificar, exonerar o extinguir:",["Impuestos","Tasas y contribuciones especiales","Multas de tránsito","Ordenanzas municipales"],0,"Artículos 135 y 301: solo la Presidenta o el Presidente de la República puede presentar proyectos de ley que creen, modifiquen o supriman impuestos, y solo mediante ley se pueden establecer, modificar, exonerar o extinguir. Las tasas y contribuciones tienen un régimen distinto.");
Qa("const","Según el artículo 301 de la Constitución, las tasas y contribuciones se establecen, modifican, exoneran o extinguen mediante:",["Solo un decreto ejecutivo sin base legal","Acto normativo de órgano competente, de acuerdo con la ley","Únicamente una resolución del SRI","Una consulta popular obligatoria"],1,"Artículo 301: solo por acto normativo de órgano competente se pueden establecer, modificar, exonerar y extinguir tasas y contribuciones, y se crean y regulan de acuerdo con la ley.");
Qa("const","Según la Constitución, ¿cuándo se considera que una resolución de un poder público NO está motivada?",["Cuando es demasiado breve","Cuando no enuncia las normas o principios jurídicos en que se funda ni explica su pertinencia respecto de los hechos","Cuando la firma un abogado externo","Cuando se notifica por medios electrónicos"],1,"Artículo 76, numeral 7, letra l: no hay motivación si la resolución no enuncia las normas o principios jurídicos en que se funda y no explica la pertinencia de su aplicación a los antecedentes de hecho. La extensión no es el criterio.");
Qa("const","El derecho a la seguridad jurídica se fundamenta en:",["La discrecionalidad de la autoridad","El respeto a la Constitución y la existencia de normas jurídicas previas, claras, públicas y aplicadas por las autoridades competentes","La aplicación retroactiva de la norma más favorable a la Administración","La costumbre administrativa"],1,"Artículo 82 de la Constitución.");
Qa("const","¿Qué derecho garantiza el acceso gratuito a la justicia y que en ningún caso una persona quede en indefensión?",["La tutela judicial efectiva","El derecho de petición","La libertad de empresa","El derecho a la propiedad"],0,"Artículo 75: toda persona tiene derecho al acceso gratuito a la justicia y a la tutela efectiva, imparcial y expedita de sus derechos e intereses, con sujeción a los principios de inmediación y celeridad, y en ningún caso quedará en indefensión.");
Qa("const","La acción de protección tiene por objeto:",["Cobrar deudas tributarias","El amparo directo y eficaz de los derechos reconocidos en la Constitución","Reformar leyes inconstitucionales","Resolver conflictos entre funciones del Estado"],1,"Artículo 88: procede cuando existe vulneración de derechos constitucionales, entre otros supuestos, por actos u omisiones de cualquier autoridad pública no judicial.");
Qa("const","La acción extraordinaria de protección procede contra:",["Leyes y decretos","Sentencias, autos definitivos y resoluciones con fuerza de sentencia que violen derechos constitucionales","Actos administrativos de cualquier autoridad","Contratos privados"],1,"Artículo 94: se interpone ante la Corte Constitucional, una vez agotados los recursos ordinarios y extraordinarios dentro del término legal, salvo que su falta de interposición no sea atribuible a la negligencia de la persona titular del derecho.");
Qa("const","Según el artículo 173 de la Constitución, los actos administrativos de cualquier autoridad del Estado pueden ser impugnados:",["Solo en la vía administrativa","Solo ante la Corte Constitucional","Tanto en la vía administrativa como ante los órganos de la Función Judicial","Únicamente mediante consulta popular"],2,"Artículo 173: la impugnación puede hacerse en sede administrativa y ante los órganos judiciales correspondientes.");
Qa("const","Según el artículo 233 de la Constitución, ¿cuál de estos delitos tiene acciones y penas imprescriptibles?",["Peculado","Defraudación tributaria","Estafa","Injuria"],0,"El artículo 233 declara imprescriptibles las acciones y penas por peculado, cohecho, concusión y enriquecimiento ilícito, y permite iniciar y continuar el juicio incluso en ausencia de la persona acusada.");
Qa("const","En materia de derechos y garantías constitucionales, las servidoras y servidores públicos deben aplicar:",["La norma más antigua","La norma y la interpretación que más favorezcan su efectiva vigencia","La interpretación literal en todos los casos","La norma que restrinja más el derecho"],1,"Artículo 11, numeral 5.");
Qa("const","Las normas y los actos del poder público que no mantengan conformidad con las disposiciones constitucionales:",["Son válidos hasta que un juez los derogue","Carecen de eficacia jurídica","Solo se aplican a casos futuros","Se convierten en ley al año"],1,"Artículo 424: la Constitución es la norma suprema y prevalece sobre cualquier otra del ordenamiento jurídico; las normas y actos contrarios carecen de eficacia jurídica.");
Qa("const","Según el artículo 132 de la Constitución, requiere ley orgánica:",["Regular el ejercicio de los derechos y garantías constitucionales","Establecer el horario de una oficina pública","Reformar un reglamento interno","Aprobar una ordenanza municipal de tránsito"],0,"Las leyes orgánicas regulan la organización y funcionamiento de las instituciones creadas por la Constitución, el ejercicio de los derechos y garantías, la organización y competencias de los gobiernos autónomos descentralizados, y el régimen de partidos políticos y el sistema electoral.");
Qa("ct","¿Cuál NO figura entre los principios del régimen tributario del artículo 5 del Código Tributario?",["Legalidad","Igualdad","Proporcionalidad","Confiscatoriedad"],3,"El artículo 5 menciona legalidad, generalidad, igualdad, proporcionalidad e irretroactividad. La confiscatoriedad no figura en esa lista.");
Qa("ct","La obligación tributaria nace:",["Cuando el SRI notifica la determinación","Cuando acaece el hecho generador previsto por la ley","Cuando vence el plazo para declarar","Cuando se emite el título de crédito"],1,"Artículo 18: nace en el momento en que acaece el hecho generador previsto por la ley. La exigibilidad (artículo 19) es otro momento, que llega después.");
Qa("ct","Para calificar un hecho generador definido según la naturaleza jurídica de un acto o negocio, el Código Tributario da prioridad a:",["La denominación que le den las partes","La forma jurídica elegida por los interesados","La verdadera esencia y naturaleza jurídica del acto o negocio","La costumbre comercial del contribuyente"],2,"Artículo 17: se califica conforme a su verdadera esencia y naturaleza jurídica, cualquiera que sea la forma elegida o la denominación utilizada por los interesados. Si el hecho generador se define por su naturaleza económica, se califica conforme a esta.");
Qa("sri","¿Cuál NO es una facultad de la Administración Tributaria según el Código Tributario?",["La determinadora de la obligación tributaria","La resolución de reclamos y recursos","La potestad sancionadora por infracciones tributarias","La creación de nuevos impuestos"],3,"Artículo 67: aplicación de la ley, determinadora, resolutiva de reclamos y recursos, sancionadora y recaudadora. Crear impuestos corresponde a la ley (Constitución, artículos 135 y 301).");
Qa("sri","El plazo para presentar un reclamo administrativo contra un acto determinativo de obligación tributaria es de:",["5 días hábiles","20 días hábiles","60 días hábiles","120 días hábiles"],1,"Artículo 115: veinte días, contados desde el día hábil siguiente al de la notificación. Según el artículo 12, los plazos expresados en días son siempre hábiles.");
Qa("sri","La Administración Tributaria debe resolver un reclamo en el plazo de:",["15 días hábiles","30 días hábiles","60 días hábiles","120 días hábiles"],3,"Artículo 132: 120 días hábiles, contados desde el día hábil siguiente al de la presentación del reclamo, o al de la aclaración o ampliación que disponga la autoridad.");
Qa("sri","Si la Administración Tributaria no resuelve un reclamo dentro del plazo legal:",["Se considera negado el reclamo","Se considera aceptado tácitamente y el interesado puede ejercer la acción que corresponda","El reclamo caduca","El contribuyente debe presentarlo de nuevo"],1,"El Código Tributario prevé la aceptación tácita por falta de resolución en plazo. Aun así, la Administración conserva el deber de dictar resolución expresa.");
Qa("sri","El plazo probatorio en el procedimiento administrativo tributario no puede exceder de:",["10 días","20 días","30 días","60 días"],2,"Artículo 129: se fija según la importancia o complejidad de los hechos, pero en ningún caso excede de treinta días.");
Qa("sri","En el procedimiento administrativo tributario son admisibles todos los medios de prueba que la ley establece, excepto:",["La prueba documental","La confesión de funcionarios y empleados públicos","La prueba pericial","La inspección"],1,"Artículo 128. Además, la prueba testimonial solo se admite cuando, por la naturaleza del asunto, los hechos no pudieren acreditarse de otro modo.");
Qa("sri","Los actos administrativos tributarios gozan de las presunciones de:",["Nulidad y suspensión","Legitimidad y ejecutoriedad","Prescripción y caducidad","Inocencia y reserva"],1,"Artículo 82: gozan de presunción de legitimidad y ejecutoriedad, pero son ejecutivos desde que se encuentren firmes o ejecutoriados.");
Qa("ct","Según el Código Tributario, los plazos o términos establecidos por días se entienden:",["Siempre como días calendario","Siempre como días hábiles","Como días hábiles solo si son menores a 30","Como días calendario salvo en los reclamos"],1,"Artículo 12: los plazos en días se refieren siempre a días hábiles. Los plazos en años y meses son continuos y fenecen el día equivalente al año o mes respectivo.");
Qa("sri","La notificación es:",["El acto por el cual se hace saber a una persona el contenido de un acto o resolución administrativa, o un requerimiento de un funcionario competente","La sentencia que resuelve un reclamo","La declaración que presenta el contribuyente","La orden de cobro coactiva"],0,"Artículo 105 del Código Tributario.");
Qa("sri","La transacción extraprocesal de obligaciones tributarias solo surte efectos si se instrumenta en:",["Una escritura pública ante notario","Un acta de mediación suscrita por un mediador calificado","Una resolución de la Directora o Director General","Un contrato con el contador"],1,"Fue incorporada por la Ley Orgánica para el Desarrollo Económico y Sostenibilidad Fiscal tras la Pandemia COVID-19 (Registro Oficial del 29 de noviembre de 2021) y remite a la Ley de Arbitraje y Mediación.");
Qa("ct","Según el Código Tributario, ¿cuál NO es un modo de extinguir la obligación tributaria?",["Compensación","Confusión","Remisión","Caducidad"],3,"Artículo 37: solución o pago, compensación, confusión, remisión y prescripción de la acción de cobro. La caducidad extingue la facultad de la Administración para determinar la obligación, pero no figura como modo de extinción.");
Qa("ct","Las circulares y resoluciones de carácter administrativo de la Administración Tributaria:",["Pueden ampliar el alcance de la ley","No pueden alterar el sentido de la ley ni ampliar o restringir su alcance","Prevalecen sobre la ley cuando son más recientes","Solo obligan al propio SRI"],1,"Es un límite a la facultad de la Administración de dictar normas de carácter administrativo: no pueden cambiar el sentido de la ley.");
Qa("coa","Según el artículo 99 del COA, ¿cuál NO es un requisito de validez del acto administrativo?",["Competencia","Voluntad","Motivación","Publicación en la prensa"],3,"Los requisitos de validez son: competencia, objeto, voluntad, procedimiento y motivación.");
Qa("coa","Según el artículo 100 del COA, la motivación del acto administrativo exige, entre otros elementos:",["El señalamiento de la norma o principios jurídicos aplicables y la determinación de su alcance","La aprobación previa del Presidente de la República","La firma de dos testigos","Su publicación en el Registro Oficial"],0,"La motivación exige señalar las normas o principios aplicables y su alcance, y calificar los hechos relevantes sobre la base de la evidencia que conste en el expediente administrativo.");
Qa("coa","Un acto normativo de carácter administrativo se distingue del acto administrativo porque:",["Solo lo emite el Presidente de la República","Produce efectos jurídicos generales que no se agotan con su cumplimiento","Siempre se expide de forma verbal","No requiere competencia"],1,"Artículo 128 del COA: declaración unilateral, en ejercicio de una competencia administrativa, con efectos jurídicos generales que no se agotan con su cumplimiento. El acto administrativo (artículo 98) sí se agota con su cumplimiento.");
Qa("coa","El acto de simple administración es una declaración unilateral de voluntad, interna o entre órganos de la administración, que produce efectos jurídicos:",["De forma directa sobre los ciudadanos","Solo de forma indirecta","Únicamente penales","Con fuerza de ley"],1,"Artículo 120 del COA. Se diferencia del acto administrativo, que produce efectos de forma directa.");
Qa("coa","Según el COA, es causal de nulidad del acto administrativo que:",["Se dicte sin competencia por razón de la materia, el territorio o el tiempo","Sea breve","Se emita un día viernes","Lo firme un servidor a quien se delegó válidamente la competencia"],0,"Artículo 105: entre las causales están ser contrario a la Constitución y a la ley, dictarse sin competencia por razón de materia, territorio o tiempo, y determinar actuaciones imposibles.");
Qa("coa","Según el artículo 129 del COA, la potestad reglamentaria en relación con las leyes formales corresponde a:",["El Presidente de la República","La Asamblea Nacional","Cualquier ministro","La Corte Constitucional"],0,"Artículo 129: le corresponde al Presidente de la República, de conformidad con la Constitución.");
Qa("coa","En el procedimiento de ejecución coactiva del COA, la fase preliminar comprende, entre otros:",["El requerimiento de pago voluntario y la orden de cobro","El remate de bienes","La sentencia de casación","La consulta popular"],0,"El COA regula una fase preliminar con requerimiento de pago voluntario, orden de cobro y la posibilidad de facilidades de pago.");
Qa("proc","En las acciones contencioso tributarias de impugnación o directas, el término para presentar la demanda es de:",["15 días","30 días","60 días","90 días"],2,"Artículo 306, numeral 5 del COGEP: sesenta días desde que se notificó el acto administrativo tributario o se produjo el hecho o acto en que se funda la acción. Verifica la redacción vigente: la norma ha sido reformada y la Corte Constitucional ha resuelto casos sobre cómo se cuenta este término.");
Qa("proc","Las controversias entre la Administración Tributaria y los contribuyentes se conocen en primera instancia en:",["Los tribunales distritales de lo contencioso tributario","Los juzgados de contravenciones","La Corte Constitucional","El Consejo de la Judicatura"],0,"La jurisdicción contencioso tributaria se ejerce por tribunales distritales. Según la sede, pueden denominarse tribunales de lo contencioso administrativo y tributario.");
Qa("proc","El recurso de casación en materia contencioso tributaria es resuelto por:",["La Sala Especializada de lo Contencioso Tributario de la Corte Nacional de Justicia","El mismo tribunal distrital que dictó la sentencia","La Corte Constitucional","La Fiscalía General del Estado"],0,"La Sala Especializada de lo Contencioso Tributario de la Corte Nacional de Justicia conoce la casación contra las sentencias de los tribunales distritales.");
Qa("sri","Según el artículo 298 del COIP, ¿cuál de estos verbos NO forma parte de la conducta base de la defraudación tributaria?",["Simular","Ocultar","Falsear","Coaccionar"],3,"El tipo base sanciona a quien simule, oculte, omita, falsee o engañe a la Administración Tributaria para dejar de cumplir sus obligaciones o de pagar total o parcialmente los tributos debidos, en provecho propio o de un tercero.");
Qa("sri","Utilizar identidad o identificación supuesta o falsa para inscribirse, actualizar o cancelar registros tributarios es:",["Defraudación tributaria","Una simple falta reglamentaria","Un hecho sin sanción","Una contravención de tránsito"],0,"Es el numeral 1 del artículo 298 del COIP. Los numerales 1 al 11 se sancionan con pena privativa de libertad de uno a tres años.");
Qa("sri","Emitir, aceptar o presentar comprobantes de venta por operaciones inexistentes es defraudación tributaria sancionada con pena privativa de libertad de:",["1 a 3 años","3 a 5 años","5 a 7 años","7 a 10 años"],1,"Es el numeral 12 del artículo 298 del COIP: de tres a cinco años. Si el monto de los comprobantes supera 100 salarios básicos unificados (SBU), se aplica el máximo de la pena.");
Qa("sri","Las conductas de los numerales 15 a 17 del artículo 298 del COIP (por ejemplo, omitir ingresos o incluir costos, gastos o deducciones falsos o superiores a los legales) se sancionan con:",["1 a 3 años","3 a 5 años","5 a 7 años","7 a 10 años"],2,"Numerales 15 a 17: de cinco a siete años, y el máximo de la pena cuando los impuestos defraudados superan 100 SBU.");
Qa("sri","Cuando los impuestos retenidos o percibidos que no fueron declarados ni pagados, o los devueltos dolosamente, superan los 100 SBU, la pena por defraudación es de:",["3 a 5 años","5 a 7 años","7 a 10 años","10 a 13 años"],2,"Artículo 298 del COIP: en los numerales 18 y 19 la pena es de cinco a siete años; si los impuestos retenidos o percibidos no declarados o pagados, o devueltos dolosamente, superan los 100 SBU, es de siete a diez años.");
Qa("sri","La defraudación tributaria cometida con la participación de servidores de la Administración Tributaria se considera agravada y acarrea, además:",["La destitución del cargo de esos servidores","Solo una amonestación","La suspensión de la pena","La prescripción de la acción"],0,"Se sanciona con el máximo de la pena prevista para cada caso y con la destitución del cargo de los servidores que participaron.");

/* ===================== CÓDIGO TRIBUTARIO ===================== */
Q('ct','Según el Código Tributario, la obligación tributaria es:','El vínculo jurídico personal entre el Estado y los contribuyentes o responsables, por el cual debe satisfacerse una prestación al verificarse el hecho generador','Un contrato voluntario entre el contribuyente y el SRI para fraccionar el pago de un impuesto','La facultad del SRI de sancionar a los contribuyentes por sus infracciones','La declaración que el contribuyente presenta cada mes','Art. 15: la obligación tributaria nace cuando se verifica el hecho generador previsto en la ley y es un vínculo jurídico personal entre el Estado y los contribuyentes o responsables.');
Q('ct','Cuando varias personas son coobligadas solidarias de una misma obligación tributaria, la Administración Tributaria puede:','Exigir el cumplimiento total de la obligación a cualquiera de ellas','Cobrar solo una parte proporcional a cada una','Cobrar únicamente a la primera que se registró','Esperar a que ellas decidan quién paga','En la solidaridad, el sujeto activo puede reclamar el total a cualquiera de los coobligados; quien paga puede luego repetir contra los demás.');
Q('ct','Para efectos tributarios, el domicilio de una persona natural es:','El lugar de su residencia habitual o donde ejerza sus actividades económicas','El lugar de nacimiento que consta en su cédula','El domicilio de su empleador, siempre','La provincia donde vota','Art. 59 del Código Tributario: la residencia habitual o el lugar donde desarrolla sus actividades económicas, según el caso.');
Q('ct','Las deudas tributarias pueden condonarse o remitirse únicamente:','En virtud de ley, en la cuantía y con los requisitos que ella determine','Por decisión del jefe de la agencia zonal','Por acuerdo entre el contribuyente y su contador','Por resolución de un juez civil','Art. 54: la remisión (condonación) solo procede por ley. Ningún funcionario puede perdonar un tributo por decisión propia.');
Q('ct','En el orden nacional, la dirección de la administración tributaria corresponde:','Al Presidente de la República, quien la ejerce por medio de los órganos que la ley establece','Al Ministro de Economía de forma exclusiva','A la Asamblea Nacional','Al Consejo de la Judicatura','Art. 65 del Código Tributario. El SRI es el órgano que ejerce la administración tributaria nacional.');
Q('ct','Las leyes tributarias, sus reglamentos y las circulares de carácter general se interpretan:','Con arreglo a los métodos admitidos en derecho, teniendo en cuenta su fin','Únicamente de forma literal','Siempre en el sentido más favorable al fisco','Siempre en el sentido más favorable al contribuyente','Art. 13: se aplican los métodos de interpretación jurídica, atendiendo al fin de la norma; no hay una regla que favorezca automáticamente a una de las partes.');
Q('ct','Salvo que fijen fechas especiales, las leyes tributarias rigen desde:','El día siguiente al de su publicación en el Registro Oficial','El día de su aprobación en la Asamblea','El primer día del año siguiente en todos los casos','Treinta días después de su publicación','Art. 11 del Código Tributario. Ciertas normas (por ejemplo, sobre impuestos directos) tienen reglas particulares de aplicación por ejercicio fiscal.');
Q('ct','Si una obligación tributaria no se paga en el plazo legal, causa a favor del sujeto activo:','Intereses, sin necesidad de resolución administrativa alguna','Solo multas, previa resolución','Un recargo fijo del 20 % únicamente','Ningún efecto hasta que se determine la deuda','Art. 21: la falta de pago oportuno genera intereses desde el vencimiento, sin necesidad de resolución.');
Q('ct','Respecto de la prescripción tributaria, es correcto que:','Debe ser alegada expresamente por quien pretende beneficiarse; el juez o la autoridad no puede declararla de oficio','La declara de oficio la Administración cuando corresponde','Opera de pleno derecho y no hace falta invocarla','Solo la puede pedir el sujeto activo','Art. 56: la prescripción debe ser alegada expresamente por quien pretenda beneficiarse de ella; no se declara de oficio.');
Q('ct','El principio «no hay tributo sin ley» significa que:','Solo por acto legislativo de órgano competente se pueden establecer, modificar o extinguir tributos','El Presidente puede crear impuestos por decreto sin límite','Los municipios pueden crear cualquier impuesto por resolución','Las circulares del SRI pueden crear tributos nuevos','Art. 3 del Código Tributario y Art. 301 de la Constitución: reserva de ley para crear, modificar o suprimir impuestos; las tasas y contribuciones se establecen por acto normativo de órgano competente.');

/* ===================== IMPUESTO A LA RENTA ===================== */
Q('lrti','¿Quiénes son sujetos pasivos del Impuesto a la Renta?','Las personas naturales, las sucesiones indivisas y las sociedades, nacionales o extranjeras','Solo las sociedades','Únicamente quienes tienen relación de dependencia','Solo las personas que superan USD 100.000 de ingresos','Art. 4 de la LRTI: personas naturales, sucesiones indivisas y sociedades nacionales o extranjeras que obtengan ingresos gravados.');
Q('lrti','Los ingresos de fuente ecuatoriana son, en general:','Los obtenidos por actividades laborales, profesionales, comerciales, industriales o de otra índole realizadas en territorio ecuatoriano, y otros previstos en la ley','Solo los obtenidos por empresas con sede en Quito','Únicamente los ingresos en dólares depositados en bancos locales','Los obtenidos en cualquier país por un ecuatoriano, sin excepción','Art. 8 de la LRTI enumera los ingresos de fuente ecuatoriana; el criterio central es la actividad o el bien ubicado en el país.');
Q('lrti','El décimo tercer y el décimo cuarto sueldo son, para el trabajador, ingresos:','Exentos del Impuesto a la Renta','Gravados con tarifa del 25 %','Gravados solo si superan USD 5.000','Sometidos a retención del 10 %','La LRTI y su reglamento los consideran ingresos exentos de los trabajadores en relación de dependencia.');
Q('lrti','El aporte personal al IESS (9,45 %) que paga el trabajador es:','Deducible de los ingresos gravados para llegar a la base imponible','No deducible','Un crédito tributario contra el IVA','Un ingreso exento del empleador','El aporte personal al IESS se resta de los ingresos gravados del trabajador para determinar su base imponible del IR.');
Q('lrti','La fracción básica desgravada del Impuesto a la Renta de personas naturales para el ejercicio 2026 es de:','USD 12.208','USD 12.081','USD 11.310','USD 15.549','Resolución NAC-DGERCGC25-00000043 (29 de diciembre de 2025). Para el ejercicio 2025 fue USD 12.081; se actualiza cada año según el IPC.');
Q('lrti','La tarifa marginal más alta de la tabla del IR para personas naturales (0 % a …) es del:','37 %','25 %','30 %','35 %','La tabla progresiva va del 0 % al 37 % (tramo superior desde USD 109.956 en 2026).');
QC('lrti',irTablaHTML(),'Con la tabla 2026, una base imponible de USD 18.000 genera un impuesto causado de:','USD 412,10','USD 1.800,00','USD 167,00','USD 245,10','Tramo USD 15.549 a 20.188: impuesto fijo 167 + 10 % sobre el excedente (18.000 − 15.549 = 2.451 → 245,10) = 412,10.');
Q('lrti','Desde 2023, los gastos personales deducibles de una persona natural:','Generan una rebaja sobre el impuesto causado, con un tope según el número de cargas, y no se restan de la base imponible','Se restan de la base imponible sin límite','Solo aplican a contribuyentes RIMPE','Se restan del IVA a pagar','La reforma cambió el mecanismo: de deducción de la base imponible a rebaja del impuesto causado, con tope según cargas familiares.');
Q('lrti','Respecto de la base imponible, la normativa del IR concede a las personas con discapacidad (o sus sustitutos):','Dos fracciones básicas gravadas con tarifa cero','Ninguna ventaja tributaria','La devolución total del impuesto','Solo una exención del IVA','Las personas con discapacidad o sus sustitutos descuentan dos fracciones básicas gravadas con tarifa cero, y los adultos mayores una (según la información del SRI).');
Q('lrti','Un contribuyente persona natural cuyo noveno dígito del RUC es 4 debe presentar su declaración de IR en marzo, hasta el día:','16','10','14','18','Calendario por noveno dígito: 1→10, 2→12, 3→14, 4→16, 5→18, 6→20, 7→22, 8→24, 9→26, 0→28.');
Q('lrti','Las sociedades presentan su declaración anual del IR, por regla general, en el mes de:','Abril','Enero','Marzo','Julio','Las sociedades declaran en abril (según el noveno dígito del RUC) y las personas naturales en marzo.');
Q('lrti','El formulario que utilizan las sociedades para la declaración del Impuesto a la Renta es el:','101','102','103','104','101: IR de sociedades; 102 y 102A: personas naturales; 103: retenciones en la fuente; 104: IVA.');
Q('lrti','El formulario 107 es:','El comprobante de retenciones en la fuente por relación de dependencia entregado al trabajador','La declaración mensual del IVA','La declaración de IR de sociedades','El anexo de compras y ventas','El empleador entrega a cada trabajador el formulario 107 con los ingresos y retenciones del año.');
Q('lrti','El Anexo RDEP corresponde a:','La información anual de los pagos y retenciones a trabajadores en relación de dependencia','Los pagos al exterior','El detalle mensual de ventas','La declaración de dividendos','El RDEP (Relación de Dependencia) lo presentan los empleadores que actúan como agentes de retención de sus trabajadores.');
Q('lrti','Para que un gasto sea deducible del Impuesto a la Renta debe, entre otros requisitos:','Estar relacionado con la actividad generadora de ingresos y sustentado en comprobantes de venta válidos','Haberse pagado siempre en efectivo','Ser aprobado previamente por el SRI','Corresponder a gastos personales del socio','Art. 10 de la LRTI: los gastos deben ser necesarios y causados para obtener ingresos gravados y estar respaldados con comprobantes; además, cumplir bancarización cuando aplica.');
Q('lrti','La participación de los trabajadores en las utilidades de la empresa es del:','15 % de la utilidad','10 % de la utilidad','25 % de la utilidad','5 % de la utilidad','Código de Trabajo: 15 % de las utilidades líquidas (10 % a los trabajadores y 5 % por cargas familiares).');
Q('lrti','La base imponible del IR de una sociedad se obtiene, de forma simplificada, así:','Utilidad contable − 15 % de participación de trabajadores − ingresos exentos + gastos no deducibles','Ventas totales × 25 %','Utilidad contable + 15 % de participación','Costos totales − ventas','Es la conciliación tributaria: se parte de la utilidad contable y se ajustan las partidas que la ley trata distinto.');
Q('lrti','El anticipo del Impuesto a la Renta se paga, por regla general, en dos cuotas en los meses de:','Julio y septiembre','Enero y marzo','Abril y octubre','Marzo y abril','El anticipo se paga en julio y septiembre del año del ejercicio y luego se compensa con el impuesto causado.');
Q('lrti','Las retenciones en la fuente de IR que le hicieron a un contribuyente durante el año:','Se descuentan como crédito tributario del impuesto causado en su declaración anual','Se pierden si no se reclaman','Se suman al impuesto causado','Se devuelven siempre de inmediato','La retención es un anticipo del impuesto: en la declaración anual se resta del impuesto causado; si hay exceso, puede pedirse devolución.');
Q('lrti','Las pérdidas de una sociedad pueden amortizarse en los períodos siguientes durante:','Cinco años, hasta el 25 % de las utilidades gravables de cada período','Un solo año','Diez años sin límite','Tres años con el 50 % de la utilidad','Art. 11 de la LRTI: amortización de pérdidas dentro de los cinco períodos siguientes, con el límite del 25 % de las utilidades gravables de cada período.');
Q('lrti','Los costos y gastos sustentados en comprobantes de venta falsos o de contribuyentes inexistentes:','No son deducibles y pueden constituir defraudación tributaria','Son deducibles si el pago fue por transferencia','Son deducibles con una multa del 5 %','Se aceptan si los presenta un contador','Un gasto sin sustento válido no es deducible; además, usar comprobantes falsos puede configurar delito de defraudación (COIP Art. 298).');

/* ===================== IVA ===================== */
Q('iva','El IVA es un impuesto:','Indirecto, que grava el consumo y es trasladado al consumidor final','Directo, que grava las utilidades','Directo, que grava el patrimonio','Que solo pagan las sociedades','El IVA lo paga quien consume; el vendedor lo cobra y lo declara al SRI.');
Q('iva','El IVA grava, entre otros hechos:','La transferencia de bienes muebles de naturaleza corporal, las importaciones y la prestación de servicios','Solo la venta de inmuebles','Únicamente las exportaciones','Solo los servicios financieros','Art. 52 de la LRTI: transferencias de dominio de bienes muebles corporales, derechos de autor y propiedad industrial, importaciones y prestación de servicios.');
Q('iva','Con tarifa 0 % de IVA están, en general, los servicios de:','Educación y salud','Publicidad y consultoría','Telecomunicaciones de lujo','Restaurantes y hoteles','Los servicios de salud y educación tienen tarifa 0 % según la ley, y también otros bienes de primera necesidad y medicamentos.');
Q('iva','Las exportaciones de bienes tienen:','Tarifa 0 % de IVA y derecho a crédito tributario y devolución del IVA pagado en insumos','Tarifa 15 % de IVA','Tarifa 5 % de IVA','No tienen derecho a recuperar el IVA de sus compras','La LRTI grava con tarifa 0 % las exportaciones de bienes; el exportador puede recuperar el IVA pagado en sus adquisiciones vinculadas.');
Q('iva','El crédito tributario del IVA consiste en:','Descontar del IVA cobrado en ventas el IVA pagado en compras relacionadas con la actividad gravada','Recibir una devolución automática de todo el IVA pagado','Pagar el IVA en cuotas','Cobrar menos IVA a los clientes','El sujeto pasivo compensa el IVA de sus compras (crédito) con el IVA de sus ventas (débito); el saldo se paga o pasa como crédito a meses siguientes.');
Q('iva','El factor de proporcionalidad del IVA se usa cuando un contribuyente:','Realiza ventas gravadas y ventas con tarifa 0 % o no gravadas, y solo puede usar parte del crédito tributario','Vende únicamente exportaciones','No tiene compras','Es agente de retención','Cuando hay ventas gravadas y no gravadas o exentas, el crédito tributario utilizable es proporcional a las ventas gravadas.');
Q('iva','Declaran el IVA de forma semestral, por regla general, quienes:','Solo transfieren bienes o prestan servicios con tarifa 0 % o no gravados','Superan los USD 300.000 de ventas','Son sociedades','Importan bienes','La declaración es mensual (formulario 104) salvo para los contribuyentes que solo realizan operaciones con tarifa 0 % o no gravadas, que pueden declarar semestralmente.');
Q('iva','Un contribuyente con noveno dígito del RUC 8 debe presentar su declaración mensual de IVA hasta el día:','24','10','20','28','1→10, 2→12, 3→14, 4→16, 5→18, 6→20, 7→22, 8→24, 9→26, 0→28 del mes siguiente.');
Q('iva','La base imponible del IVA en una venta local:','Es el valor total del bien o servicio, incluidos otros impuestos como el ICE, pero sin incluir el propio IVA','Incluye el IVA','Es solo el costo de producción','Es el valor de compra','Art. 58 de la LRTI: valor total de los bienes o servicios incluyendo impuestos, tasas y otros gravámenes, excepto el IVA.');
Q('iva','En la transferencia local de bienes, el IVA se causa cuando:','Se entrega el bien o se emite la factura, lo que ocurra primero','Se cobra el último pago','Termina el año fiscal','Se declara el impuesto','Momento de causación: entrega del bien o emisión del comprobante de venta, lo que suceda primero (Art. 61 de la LRTI).');
Q('iva','En las importaciones el IVA se causa:','En el momento del despacho a consumo (nacionalización) de la mercadería','Al salir la mercadería del país de origen','Al emitirse la factura del vendedor extranjero','Al declararse el IR','El IVA en importaciones se liquida con la declaración aduanera, cuando la mercadería se despacha a consumo.');
Q('iva','Las personas adultas mayores y con discapacidad tienen derecho, según la ley, a:','La devolución del IVA pagado en sus adquisiciones de bienes y servicios de uso personal, dentro de los límites','La exoneración total de cualquier impuesto','Cobrar IVA a sus clientes','Declarar el IVA cada año','Es un mecanismo de devolución del IVA pagado por estos grupos, sujeto a requisitos y a topes definidos por la normativa.');

/* ===================== RETENCIONES ===================== */
Q('ret','Actúan como agentes de retención, por regla general:','Las sociedades, las personas naturales obligadas a llevar contabilidad y las entidades del sector público','Todas las personas naturales sin excepción','Solo los bancos','Únicamente los contribuyentes RIMPE','Son agentes de retención los designados por la ley o por el SRI; las personas naturales no obligadas a llevar contabilidad no actúan como tales, salvo excepciones.');
Q('ret','Un contribuyente especial es:','Una persona o sociedad calificada por el SRI como tal por su importancia económica, con obligaciones adicionales como agente de retención','Cualquier persona que paga IVA','Un contribuyente que está exento de todo tributo','Un funcionario del SRI','El SRI califica a los contribuyentes especiales y les atribuye obligaciones específicas de retención y de presentación de información.');
Q('ret','Desde el 1 de marzo de 2026, la retención de IR en la compra de bienes muebles es del:','2 %','1,75 %','2,75 %','10 %','Resolución NAC-DGERCGC26-00000009: bienes muebles pasó de 1,75 % a 2 %. Verifica siempre la tabla vigente.');
Q('ret','Desde el 1 de marzo de 2026, la retención de IR por servicios de mano de obra es del:','3 %','2 %','1,75 %','5 %','Resolución NAC-DGERCGC26-00000009: los servicios de mano de obra pasaron del 2 % al 3 %.');
Q('ret','Desde el 1 de marzo de 2026, la retención de IR por honorarios de una persona natural por servicios donde prima el intelecto es del:','10 %','5 %','8 %','2 %','El 10 % aplica a honorarios profesionales de personas naturales; para servicios profesionales prestados por sociedades se creó una tarifa del 5 %.');
Q('ret','Desde el 1 de marzo de 2026, la retención de IR por servicios profesionales prestados por una sociedad residente es del:','5 %','10 %','3 %','2,75 %','La Resolución NAC-DGERCGC26-00000009 creó la tarifa del 5 % para esta operación y eliminó la del 2,75 %.');
Q('ret','Desde el 1 de marzo de 2026, la retención de IR por arrendamiento de bienes inmuebles es del:','10 %','8 %','5 %','2 %','El arrendamiento de inmuebles subió del 8 % al 10 % con la Resolución NAC-DGERCGC26-00000009.');
Q('ret','Según la tabla vigente desde marzo de 2026, a los pagos sin un porcentaje específico les corresponde una retención de IR del:','3 %','2,75 %','1 %','10 %','La regla general pasó a 3 % y reemplazó al antiguo 2,75 %.');
Q('ret','¿Qué cambio importante introdujo la Resolución NAC-DGERCGC26-00000009 en las retenciones de IR?','Eliminó la tarifa del 2,75 % y creó una del 5 %, entre otros ajustes','Eliminó todas las retenciones','Fijó una única tarifa del 15 %','Suprimió la retención a las sociedades','Rige desde el 1 de marzo de 2026. Verifica siempre la tabla vigente en el SRI.');
Q('ret','La retención de IVA en la compra de bienes es, en la regla general, del:','30 % del IVA facturado','30 % del subtotal','70 % del IVA','100 % del IVA','La retención se calcula sobre el valor del IVA, no sobre la base: bienes 30 %, servicios 70 %.');
Q('ret','La retención de IVA en la prestación de servicios es, en la regla general, del:','70 % del IVA facturado','30 % del IVA','100 % del subtotal','10 % del subtotal','Servicios: 70 % del IVA. Honorarios profesionales, arrendamiento a personas naturales y liquidaciones de compra: 100 %.');
Q('ret','Un agente de retención paga honorarios profesionales con IVA. La retención de IVA es del:','100 % del IVA','30 % del IVA','70 % del subtotal','0 %','En honorarios profesionales, arrendamiento de inmuebles a personas naturales y liquidaciones de compra la retención de IVA es del 100 % del IVA.');
Q('ret','La retención de IVA se calcula sobre:','El valor del IVA de la factura, no sobre el subtotal','El subtotal de la factura','El total de la factura con IVA','El IR retenido','Ejemplo: IVA de 150 con retención del 70 % → se retiene 105 (no el 70 % del subtotal).');
Q('ret','El comprobante de retención electrónico debe emitirse y entregarse, por regla general, dentro de:','5 días hábiles','48 horas','30 días hábiles','El mismo día del pago sin excepción','La normativa vigente establece el plazo de cinco días hábiles para emitir y entregar el comprobante de retención.');

QC('anal','«Todos los expedientes con firma electrónica se archivan digitalmente. Este expediente no tiene firma electrónica.»','¿Qué conclusión es válida?','No se puede concluir que se archive digitalmente por esa causa','Se archiva en papel obligatoriamente','No se archiva','Se archiva digitalmente','La premisa dice qué ocurre con los expedientes con firma electrónica; de su ausencia no se deduce nada respecto de los demás.');

QC('anal','«Capacitar al personal en atención mejora la satisfacción del usuario.»','¿Qué dato fortalecería más esta afirmación?','Tras la capacitación, la satisfacción subió en las oficinas que la recibieron y no en las demás','Los cursos duraron dos días','El personal viajó a la capital','El instructor es joven','Una comparación con grupo de control apoya la relación causal.');
QC('anal','Texto: «El uso de expedientes digitales reduce el tiempo de búsqueda, pero exige inversión en seguridad y capacitación.»','¿Cuál es la mejor síntesis?','Los expedientes digitales ahorran tiempo pero requieren seguridad y formación','Los expedientes digitales no sirven','Los expedientes en papel son mejores','Solo importa el costo','Una buena síntesis recoge la idea central y la condición.');

Q('psico','Un compañero de su equipo cometió un error en un informe que se entrega mañana. Usted lo nota. ¿Qué hace?','Se lo comunica de inmediato y le ofrece ayuda para corregirlo antes de la entrega','Lo corrige sin avisarle','Se lo comenta al jefe delante de todos','Espera a que otros lo descubran','Competencia: trabajo en equipo y comunicación. Informar directamente y colaborar protege al equipo y la calidad.');

/* ---------- 3. Gestión legal institucional y procedimientos ---------- */
Q('gest','En derecho administrativo, la competencia se caracteriza por ser:','Irrenunciable, y se ejerce por los órganos que la tienen atribuida, salvo delegación, avocación u otras figuras previstas en la ley','Renunciable si la autoridad lo decide','Transferible sin norma','Ilimitada','Es un principio del COA: nadie puede ejercer competencias que no le han sido atribuidas.');

/* ---------- 4. Sumarios administrativos y régimen disciplinario ---------- */
Q('disc','Las faltas de las y los estudiantes se clasifican en:','Leves, graves y muy graves','Solo graves','Solo leves','Menores y mayores sin clasificación','Reglamento General a la LOEI (reformado en 2023).');

/* ---------- 5. Derecho de niñez y adolescencia ---------- */
Q('cona','El Código de la Niñez y Adolescencia protege a todo ser humano:','Desde su concepción hasta que cumpla dieciocho años de edad','Solo desde el nacimiento hasta los doce años','Solo desde los seis años','Solo a los estudiantes de instituciones públicas','Art. 2 del Código; por excepción protege a personas mayores de esa edad en los casos que establece.');

Q('cona','Al aplicar una medida disciplinaria a un estudiante menor de edad, la institución debe:','Respetar el debido proceso, la proporcionalidad, la participación del representante legal y el interés superior','Aplicarla sin escuchar al estudiante','Publicar su nombre','Delegarla a compañeros','Las sanciones tienen fines educativos, no punitivos.');

/* ---------- 6. Contratación pública (LOSNCP) ---------- */
Q('losncp','El Sistema Nacional de Contratación Pública regula:','Las contrataciones realizadas por las entidades contratantes con fondos públicos','Solo los contratos laborales','Los contratos entre particulares','Los convenios internacionales de deuda','La LOSNCP y su reglamento regulan el planeamiento, la programación, el control y la ejecución de las contrataciones.');

/* =========================================================
   ESTADÍSTICAS DE USO (opcional) Y PESTAÑA DE ADMINISTRADOR
   Solo se activa si CFG.endpoint tiene la dirección del servicio.
   Solo envía datos de quienes lo AUTORIZAN expresamente.
   ========================================================= */
var TQ_KEY='pcv3_q',tSending=false;
function devType(){
  var ua=(navigator.userAgent||'');
  if(/iPad|Tablet/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return 'tablet';
  if(/Mobi|Android|iPhone|iPod/i.test(ua))return 'movil';
  return 'escritorio';
}
function consentOn(){var r=CUR&&U.users[CUR.id];return !!(r&&r.cons&&r.cons.v===1);}
function loginData(first){return {n:CUR.n,a:CUR.a,mask:CUR.mask,dev:devType(),prof:S.profile,first:first?1:0};}
function qload(){try{return JSON.parse(localStorage.getItem(TQ_KEY)||'[]');}catch(e){return [];}}
function qsave(q){try{localStorage.setItem(TQ_KEY,JSON.stringify(q.slice(-300)));}catch(e){}}
function tel(ty,d,force){
  if(!CFG.endpoint||!CUR)return;
  if(!force&&!consentOn())return;
  var q=qload();
  q.push({eid:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),t:Date.now(),uid:CUR.id,ty:ty,d:d||{}});
  qsave(q);tFlush();
}
function tFlush(){
  if(!CFG.endpoint||tSending||typeof fetch!=='function')return;
  var q=qload();if(!q.length)return;
  var batch=q.slice(0,40);tSending=true;
  fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:'ev',ev:batch})})
    .then(function(r){return r.json();})
    .then(function(j){
      tSending=false;
      if(j&&j.ok){var ids={};batch.forEach(function(e){ids[e.eid]=1;});qsave(qload().filter(function(e){return !ids[e.eid];}));if(qload().length)tFlush();}
    })
    .catch(function(){tSending=false;});
}
function deleteRemote(uid){
  if(!CFG.endpoint||typeof fetch!=='function')return;
  qsave(qload().filter(function(e){return e.uid!==uid;}));
  try{fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:'del',uid:uid})}).catch(function(){});}catch(e){}
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('online',function(){tFlush();});
