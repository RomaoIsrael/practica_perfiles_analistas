/* ---------- Acceso del administrador ---------- */
function admJsonp(key){
  return new Promise(function(res){
    var cb='pcvcb'+Date.now(),s=document.createElement('script'),to;
    function cleanup(){clearTimeout(to);try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
    to=setTimeout(function(){cleanup();res(null);},15000);
    window[cb]=function(j){cleanup();res(j);};
    s.onerror=function(){cleanup();res(null);};
    s.src=CFG.endpoint+(CFG.endpoint.indexOf('?')<0?'?':'&')+'callback='+cb+'&key='+encodeURIComponent(key);
    document.head.appendChild(s);
  });
}
function admFetch(key){
  ui.adm.loading=true;ui.adm.err='';render();
  var p;
  try{
    p=fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:'admin',key:key})}).then(function(r){return r.json();}).catch(function(){return admJsonp(key);});
  }catch(e){p=admJsonp(key);}
  p.then(function(j){
    ui.adm.loading=false;
    if(j&&j.ok){ui.adm.data=j;ui.adm.key=key;ui.adm.err='';}
    else ui.adm.err=(j&&j.err==='auth')?'Clave incorrecta.':'No se pudo conectar con el servicio. Revisa la dirección configurada y tu conexión.';
    render();
  });
}

/* ---------- Cálculo de indicadores ---------- */
function admKPI(D){
  var now=Date.now(),DAY=86400000,K={};
  var byU={};
  D.users.forEach(function(u){byU[u.uid]={u:u,ses:[],days:{},starts:0,last:u.last||0,likert:null,imports:0};});
  D.sessions.forEach(function(s){var b=byU[s.uid];if(b){b.ses.push(s);if(s.t>b.last)b.last=s.t;}});
  var nStarts=0,likertN=0,importEv=0,importQs=0,likertSum={},likertCnt={};
  D.events.forEach(function(e){
    var b=byU[e.uid];if(!b)return;
    if(e.ty==='login'){b.days[new Date(e.t).toDateString()]=1;if(e.t>b.last)b.last=e.t;}
    else if(e.ty==='start')nStarts++;
    else if(e.ty==='likert'){b.likert=e.d.scores||{};}
    else if(e.ty==='import'){b.imports++;importEv++;importQs+=(e.d.n||0);}
  });
  var users=Object.keys(byU).map(function(k){return byU[k];});
  K.byU=byU;K.users=users;K.nUsers=users.length;
  K.new7=users.filter(function(b){return (b.u.first||0)>=now-7*DAY;}).length;
  K.new30=users.filter(function(b){return (b.u.first||0)>=now-30*DAY;}).length;
  K.act7=users.filter(function(b){return b.last>=now-7*DAY;}).length;
  K.act30=users.filter(function(b){return b.last>=now-30*DAY;}).length;
  K.returning=users.filter(function(b){return Object.keys(b.days).length>=2;}).length;
  K.retention=pct(K.returning,K.nUsers);
  K.nSes=D.sessions.length;K.nStarts=Math.max(nStarts,K.nSes);
  K.completion=K.nStarts?pct(K.nSes,K.nStarts):0;
  K.noSes=users.filter(function(b){return !b.ses.length;}).length;
  var ok=0,tot=0,pass=0,secs=0;
  D.sessions.forEach(function(s){ok+=s.ok;tot+=s.total;pass+=s.pass?1:0;secs+=s.secs||0;});
  K.acc=pct(ok,tot);K.passRate=pct(pass,K.nSes);K.avgMin=K.nSes?Math.round(secs/K.nSes/60*10)/10:0;K.nQ=tot;
  K.perUser=K.nUsers?Math.round(K.nSes/K.nUsers*10)/10:0;
  /* por perfil, modo, dispositivo, tema, hora, día */
  K.prof={};K.mode={};K.dev={};K.cat={};K.hour=[];K.day={};
  for(var h=0;h<24;h++)K.hour.push(0);
  users.forEach(function(b){var d=b.u.dev||'?';K.dev[d]=(K.dev[d]||0)+1;});
  D.sessions.forEach(function(s){
    var p=K.prof[s.prof]||(K.prof[s.prof]={ses:0,ok:0,tot:0,pass:0,u:{}});p.ses++;p.ok+=s.ok;p.tot+=s.total;p.pass+=s.pass?1:0;p.u[s.uid]=1;
    K.mode[s.mode]=(K.mode[s.mode]||0)+1;
    Object.keys(s.cats||{}).forEach(function(c){var x=K.cat[c]||(K.cat[c]={ok:0,n:0});x.ok+=s.cats[c][0];x.n+=s.cats[c][1];});
    K.hour[new Date(s.t).getHours()]++;
    var dk=new Date(s.t);dk.setHours(0,0,0,0);K.day[dk.getTime()]=(K.day[dk.getTime()]||0)+1;
  });
  users.forEach(function(b){if(b.likert){likertN++;Object.keys(b.likert).forEach(function(c){likertSum[c]=(likertSum[c]||0)+b.likert[c];likertCnt[c]=(likertCnt[c]||0)+1;});}});
  K.likertN=likertN;K.likertPct=pct(likertN,K.nUsers);K.likertAvg={};Object.keys(likertSum).forEach(function(c){K.likertAvg[c]=Math.round(likertSum[c]/likertCnt[c]);});
  K.importUsers=users.filter(function(b){return b.imports>0;}).length;K.importPct=pct(K.importUsers,K.nUsers);K.importEv=importEv;K.importQs=importQs;
  return K;
}
function admInsights(K){
  var out=[];
  if(!K.nUsers)return ['Aún no hay usuarios que hayan autorizado compartir su progreso.'];
  if(K.nUsers<10)out.push('Hay pocos usuarios ('+K.nUsers+'): tómalos como indicios, no como conclusiones firmes.');
  if(K.noSes&&pct(K.noSes,K.nUsers)>=20)out.push(K.noSes+' de '+K.nUsers+' usuarios ('+pct(K.noSes,K.nUsers)+' %) se registraron pero no terminaron ninguna práctica. Mejora la primera experiencia: por ejemplo, empezar con 10 preguntas y temas preseleccionados.');
  if(K.nStarts>=5&&K.completion<70)out.push('Solo el '+K.completion+' % de las prácticas iniciadas se terminan. Considera sesiones más cortas por defecto o guardar el avance.');
  var hard=Object.keys(K.cat).filter(function(c){return K.cat[c].n>=20;}).map(function(c){return {c:c,p:pct(K.cat[c].ok,K.cat[c].n),n:K.cat[c].n};}).sort(function(a,b){return a.p-b.p;});
  if(hard.length&&hard[0].p<60)out.push('El tema «'+catLabel(hard[0].c)+'» tiene solo '+hard[0].p+' % de aciertos ('+hard[0].n+' respuestas). Revisa si las preguntas son claras y agrega explicaciones o material de estudio.');
  var unused=CATS.filter(function(c){return c.id!=='mis'&&hasContent(c.id)&&(!K.cat[c.id]||K.cat[c.id].n<10);});
  if(K.nSes>=10&&unused.length)out.push(unused.length+' tema(s) casi no se practican (menos de 10 respuestas): '+unused.slice(0,4).map(function(c){return c.name;}).join(', ')+(unused.length>4?'…':'')+'. Puede que estén poco visibles o no interesen.');
  var dv=K.dev,tD=(dv.movil||0)+(dv.tablet||0)+(dv.escritorio||0);
  if(tD&&(dv.movil||0)/tD>=0.6)out.push('El '+pct(dv.movil,tD)+' % de los usuarios entra desde el celular: prioriza probar cada cambio en pantalla pequeña.');
  if(K.nSes>=10&&K.passRate<30)out.push('Solo el '+K.passRate+' % de las prácticas alcanza el 80 %. Considera guías de estudio por tema antes de practicar.');
  if(K.nUsers>=10&&K.retention<30)out.push('Solo el '+K.retention+' % de los usuarios vuelve en otro día. Podrías agregar metas semanales o recordatorios.');
  var mx=0,mh=-1;K.hour.forEach(function(v,i){if(v>mx){mx=v;mh=i;}});
  if(K.nSes>=10&&mh>=0)out.push('La mayor actividad ocurre alrededor de las '+mh+':00 h: buen momento para publicar cambios o avisos.');
  if(K.nUsers>=10&&K.importPct<10)out.push('Solo el '+K.importPct+' % usa la carga de archivos. Si es una función importante, hazla más visible o explícala mejor.');
  if(!out.length)out.push('No se detectan alertas con los datos actuales. Sigue observando la evolución.');
  return out;
}

/* ---------- Bancos ---------- */
function importedFiles(cat){return S.imports[cat]||[];}
function importedQs(cat){var out=[];importedFiles(cat).forEach(function(f){f.qs.forEach(function(q){out.push(q);});});return out;}
function nStatic(cat){return (BYCAT[cat]||[]).length;}
function nImported(cat){var n=0;importedFiles(cat).forEach(function(f){n+=f.qs.length;});return n;}
function hasContent(cat){return nStatic(cat)>0||nImported(cat)>0||!!GENS[cat];}
function selectedCats(){
  var p=PROFMAP[S.profile];var sel=S.sel[S.profile];
  if(!sel){sel=p.allCats.filter(hasContent);S.sel[S.profile]=sel;}
  return sel.filter(function(c){return p.allCats.indexOf(c)>-1&&hasContent(c);});
}
function poolForCat(cat,genN){
  var arr=(BYCAT[cat]||[]).concat(importedQs(cat));
  if(GENS[cat])arr=arr.concat(genMany(cat,genN));
  return arr;
}
function buildQuestions(cats,count){
  var per={},total=0;
  var genN=(count==='all')?20:Math.max(12,Math.ceil((+count)/Math.max(1,cats.length))+6);
  cats.forEach(function(c){per[c]=shuffle(poolForCat(c,genN).slice());});
  if(count==='all'){var all=[];cats.forEach(function(c){all=all.concat(per[c]);});return shuffle(all);}
  var n=+count,out=[],idx={},active=cats.filter(function(c){return per[c].length>0;});
  active.forEach(function(c){idx[c]=0;});
  while(out.length<n&&active.length){
    var next=[];
    for(var i=0;i<active.length&&out.length<n;i++){
      var c=active[i];
      if(idx[c]<per[c].length){out.push(per[c][idx[c]++]);if(idx[c]<per[c].length)next.push(c);}
    }
    active=next;shuffle(active);
  }
  return shuffle(out);
}

/* ---------- Estadísticas ---------- */
function bump(cat,ok){var c=S.cats[cat]||(S.cats[cat]={seen:0,ok:0});c.seen++;if(ok)c.ok++;}
function pct(a,b){return b?Math.round(a/b*100):0;}
function catLabel(c){return CATMAP[c]?CATMAP[c].name:c;}

/* =========================================================
   IMPORTACIÓN DE ARCHIVOS
   ========================================================= */
function normAns(a,opts){
  var n=opts.length;
  if(a==null)return -1;
  if(typeof a==='number'){return (a>=0&&a<n)?a:-1;}
  var s=String(a).trim();
  var m=s.match(/^\(?([A-Fa-f])\)?[\.\)]?$/);if(m){var i=LETTERS.indexOf(m[1].toUpperCase());return i<n?i:-1;}
  for(var k=0;k<n;k++){if(opts[k].trim().toLowerCase()===s.toLowerCase())return k;}
  return -1;
}
function mkQuestion(text,opts,ans,exp,src,i,loc){
  opts=opts.map(function(o){return String(o).trim();}).filter(function(o){return o.length;});
  if(!text||opts.length<2||opts.length>6)return null;
  var a=normAns(ans,opts);if(a<0)return null;
  return {id:'u'+Math.abs(hash(src+'|'+i+'|'+text)).toString(36),text:String(text).trim(),opts:opts,ans:a,exp:exp?String(exp).trim():'',imp:true,src:src,loc:loc||''};
}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return h;}

/* Preguntas escritas en texto: 1. Pregunta / a) b) c) d) / Respuesta: b / Explicación: ... */
function parseQuestionText(text,src,unit){
  var lines=text.replace(/\r/g,'').split('\n');
  var reOpt=/^\s*\(?([A-Fa-f])[\)\.:\-]\s*(.+)$/;
  var reQ=/^\s*(?:pregunta\s*)?(\d{1,3})\s*[\)\.:\-–]\s*(.+)$/i;
  var reQ2=/^\s*(?:pregunta|p)\s*[:\.\-]\s*(.+)$/i;
  var reAns=/^\s*(?:respuesta(?:\s+correcta)?|rpta\.?|clave|correcta|answer|resp\.?)\s*[:\-=]\s*\(?([A-Fa-f])\b/i;
  var reExp=/^\s*(?:explicaci[oó]n|justificaci[oó]n|retroalimentaci[oó]n|fundamento|sustento)\s*[:\-]\s*(.*)$/i;
  var qs=[],cur=null,last=null,idx=0,page=1,qn=0;
  function fin(){
    if(cur){
      if(cur.ans==null&&cur.mark!=null)cur.ans=cur.mark;
      var loc=(unit==='pagina'?'página '+cur.page+' · ':'')+'pregunta n.º '+cur.qn+(unit==='linea'?' (línea '+cur.line+')':'');
      var q=mkQuestion(cur.q,cur.opts,cur.ans,cur.exp,src,idx++,loc);
      if(q)qs.push(q);
    }
    cur=null;last=null;
  }
  function start(qtext,ln){fin();qn++;cur={q:qtext,opts:[],ans:null,exp:'',mark:null,page:page,line:ln,qn:qn};last='q';}
  lines.forEach(function(raw,ln){
    if(raw.indexOf('\f')>-1){page+=raw.split('\f').length-1;raw=raw.replace(/\f/g,'');}
    var line=raw.replace(/\u00a0/g,' ');if(!line.trim()){return;}
    var m;
    if((m=line.match(reAns))&&cur&&cur.opts.length>=2){cur.ans=LETTERS.indexOf(m[1].toUpperCase());last='ans';return;}
    if((m=line.match(reExp))&&cur){cur.exp=m[1];last='exp';return;}
    if((m=line.match(reOpt))&&cur&&cur.q){
      var t=m[2],mark=false;
      if(/(\(correcta\)|\[correcta\]|✓|✔|\*)\s*$/i.test(t)){mark=true;t=t.replace(/\s*(\(correcta\)|\[correcta\]|✓|✔|\*)\s*$/i,'');}
      if(/^\*/.test(t)){mark=true;t=t.replace(/^\*\s*/,'');}
      cur.opts.push(t);if(mark)cur.mark=cur.opts.length-1;last='opt';return;
    }
    if((m=line.match(reQ))&&(!cur||cur.opts.length>=2||last==='ans'||last==='exp')){start(m[2],ln+1);return;}
    if((m=line.match(reQ2))){start(m[1],ln+1);return;}
    if(!cur)return;
    if(last==='q'&&cur.opts.length===0)cur.q+=' '+line.trim();
    else if(last==='opt'&&cur.opts.length)cur.opts[cur.opts.length-1]+=' '+line.trim();
    else if(last==='exp')cur.exp+=' '+line.trim();
  });
  fin();
  return qs;
}

/* CSV */
function parseCSVRows(text){
  var first=text.split('\n')[0]||'';
  var delim=[',',';','\t'].map(function(d){return [d,first.split(d).length];}).sort(function(a,b){return b[1]-a[1];})[0][0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim();}))rows.push(row);row=[];}
    else cur+=ch;
  }
  row.push(cur);if(row.some(function(x){return x.trim();}))rows.push(row);
  return rows;
}
function noAcc(s){return String(s).normalize?String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim():String(s).toLowerCase().trim();}
function parseCSVQuestions(text,src){
  var rows=parseCSVRows(text);if(rows.length<2)return [];
  var h=rows[0].map(noAcc),iq=-1,ia=-1,ie=-1,io=[];
  h.forEach(function(x,i){
    if(/^(pregunta|question|enunciado|texto)$/.test(x))iq=i;
    else if(/^(respuesta|correcta|respuesta correcta|answer|clave)$/.test(x))ia=i;

var STOP={que:1,los:1,las:1,del:1,con:1,por:1,para:1,una:1,uno:1,sus:1,este:1,esta:1,estos:1,estas:1,como:1,pero:1,sobre:1,entre:1,desde:1,hasta:1,cuando:1,donde:1,segun:1,tambien:1,cada:1,todos:1,todas:1,otros:1,otras:1,tiene:1,tienen:1,puede:1,pueden:1,deben:1,debe:1,sera:1,seran:1,haya:1,hayan:1,siendo:1,mediante:1,durante:1,cuales:1,cual:1};
var NUMW='uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta|cincuenta|sesenta|noventa|cien|ciento veinte|cinco mil|diez mil';

function clozeFromText(text,max,src,unit){
  var raws=text.replace(/\r/g,'').split('\n'),page=1,heading='',sents=[],firstLine=true;

    if(raw.indexOf('\f')>-1){page+=raw.split('\f').length-1;raw=raw.replace(/\f/g,'');}
    var b=raw.replace(/[ \t]+/g,' ').trim();if(!b)return;
    var head=b.length<=80&&!/[\.;,:]$/.test(b)&&(/^(?:cap[ií]tulo|t[ií]tulo|secci[oó]n|art[ií]culo|art\.|unidad|tema|m[oó]dulo|parte|anexo)\b/i.test(b)||(b.length<=70&&b===b.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]{3}/.test(b))||(firstLine&&b.split(' ').length<=12));

    b=b.replace(/^(?:[\u2022\u25aa\u25cf\-\*·]|\d{1,3}[\.\)]|[a-z][\.\)])\s+/,'');
    b.replace(/([\.!?;:])\s+(?=[A-ZÁÉÍÓÚÑ¿¡«"\(0-9])/g,'$1\n').split('\n').forEach(function(x){
      x=x.trim();
      if(x.length>=45&&x.length<=320&&x.split(' ').length>=7&&!/^[A-ZÁÉÍÓÚÑ\s\d\.\-]+$/.test(x)&&!/\.{4,}/.test(x))sents.push({s:x,line:ln+1,page:page,head:heading});

    var s=so.s,found=[];

    m=s.match(RE_ART);if(m){found.push({type:'art',term:m[1]});pools.art.push(m[1]);}

  var out=[],used={};
  var order=cands.length>max?cands.filter(function(c,k){return k%Math.ceil(cands.length/max)===0;}):cands;
  order=shuffle(order.slice());
  for(var ci=0;ci<order.length&&out.length<max;ci++){
    var c=order[ci];
    var prio={num:0,art:1,cap:2,word:3};
    var f=c.found.slice().sort(function(a,b){return prio[a.type]-prio[b.type]+(Math.random()-.5);})[0];
    var same=pools[f.type].filter(function(x,k,arr){return arr.indexOf(x)===k&&noAcc(x)!==noAcc(f.term)&&noAcc(x).indexOf(noAcc(f.term))<0&&noAcc(f.term).indexOf(noAcc(x))<0;});
    var d=[];
    if(f.type==='num'){
      var u=unitOf(f.term),pref=same.filter(function(x){return unitOf(x)===u;});
      d=shuffle(pref).slice(0,3);
      if(d.length<3){
        var nm=f.term.match(/^\d+/),wm=f.term.match(new RegExp('^('+NUMW+')','i')),rest=f.term.replace(/^(?:\d+|[a-záéíóú ]+?(?=\s(?:d[ií]as|a[ñn]os|meses|semanas|horas|jueces|miembros|folios|copias)))/i,''),vals=[];
        if(nm){var n0=+nm[0];vals=[n0*2,Math.round(n0/2),n0+5,n0+10,n0-5,n0*3,n0+1,n0+2].filter(function(v){return v!==n0&&v>1;}).map(function(v){return v+rest;});}
        else if(wm){var W=['dos','tres','cuatro','cinco','seis','siete','ocho','diez','quince','veinte','treinta'];vals=shuffle(W.filter(function(x){return x!==wm[1].toLowerCase();})).map(function(x){return x+rest;});}
        shuffle(vals).forEach(function(v){if(d.length<3&&d.indexOf(v)<0&&noAcc(v)!==noAcc(f.term))d.push(v);});
      }
      if(d.length<3)shuffle(same).forEach(function(x){if(d.length<3&&d.indexOf(x)<0)d.push(x);});
    }else d=shuffle(same).slice(0,3);
    if(d.length<3)continue;
    if(used[c.s])continue;used[c.s]=1;
    var blank=c.s.replace(f.term,'_____');
    if(blank===c.s)continue;
    var opts=[f.term].concat(d);
    var q=mkQuestion('Completa la frase: «'+blank+'»',opts,0,'Texto original: '+c.s,src,out.length,locOf(c.so));
    if(q)out.push(q);
  }
  return out;
}

/* Detección del tipo de contenido */
function parseAny(name,text,ext){
  var src=name,unit=ext==='pdf'?'pagina':(ext==='docx'?'parrafo':'linea');
  if(ext==='json'){var j=parseJSONQuestions(text,src);return {kind:'preguntas',qs:j};}
  if(ext==='csv'||ext==='tsv'){var c=parseCSVQuestions(text,src);if(c.length)return {kind:'preguntas',qs:c};}
  var qs=parseQuestionText(text,src,unit);
  if(qs.length>=2)return {kind:'preguntas',qs:qs};
  return {kind:'apuntes',qs:clozeFromText(text,60,src,unit)};
}

function readTextFile(file){

function u16(b,o){return b[o]|(b[o+1]<<8);}

  var counters={},out=[];
  xml.split(/<\/w:p>/).forEach(function(p){
    var t='',re=/<w:t[^>]*>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br[^>]*\/>/g,m;
    while((m=re.exec(p))){if(m[0].indexOf('<w:tab')===0)t+=' ';else if(m[0].indexOf('<w:br')===0)t+='\n';else t+=xmlDecode(m[1]);}
    t=t.replace(/\s+$/,'');if(!t.trim())return;
    var np=p.match(/<w:numPr>([\s\S]*?)<\/w:numPr>/);
    if(!np&&/<w:pStyle w:val="(?:ListNumber|Listanumerada)/i.test(p))np=['','<w:ilvl w:val="0"/><w:numId w:val="s"/>'];

function loadPdfJs(){

    s.onload=function(){clearTimeout(to);if(!window.pdfjsLib)return rej(new Error('Lector de PDF no disponible.'));window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};

    var pg=await doc.getPage(p),tc=await pg.getTextContent(),line='',y=null;
    tc.items.forEach(function(it){var yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out.push(line);line='';}y=yy;line+=(line&&!/\s$/.test(line)?' ':'')+it.str;});

async function handleFiles(files){
  var cat=ui.modal;if(!cat||!files||!files.length)return;
  ui.busy=true;ui.msg='Leyendo archivos…';renderModal();
  var msgs=[];
  for(var i=0;i<files.length;i++){
    var f=files[i],ext=(f.name.split('.').pop()||'').toLowerCase();
    try{
      var text;
      if(ext==='docx')text=await docxText(f);
      else if(ext==='pdf')text=await pdfText(f);
      else if(ext==='doc')throw new Error('El formato .doc antiguo no se puede leer. Guárdalo como .docx o .txt.');
      else text=await readTextFile(f);
      if(!text||text.replace(/\s/g,'').length<20)throw new Error('No se encontró texto legible.');
      var r=parseAny(f.name,text,ext);
      if(!r.qs.length)throw new Error('No se pudieron obtener preguntas. Revisa el formato (ver ayuda abajo).');
      (S.imports[cat]=S.imports[cat]||[]).push({name:f.name,kind:r.kind,n:r.qs.length,t:Date.now(),qs:r.qs});
      tel('import',{cat:cat,kind:r.kind,n:r.qs.length});
      msgs.push('✔ '+f.name+': '+r.qs.length+(r.kind==='preguntas'?' preguntas importadas':' preguntas de completar generadas de tus apuntes'));
    }catch(err){msgs.push('✖ '+f.name+': '+(err&&err.message?err.message:'no se pudo leer'));}
  }
  var ok=saveState();
  if(!ok)msgs.push('Aviso: no se pudo guardar en este navegador; los archivos solo estarán disponibles hasta que cierres la página.');
  ui.busy=false;ui.msg=msgs.join('\n');

}
function removeFile(cat,i){
  if(!S.imports[cat])return;S.imports[cat].splice(i,1);if(!S.imports[cat].length)delete S.imports[cat];
  saveState();ui.msg='Archivo quitado.';render();
}

function donutSVG(p,size){
  size=size||132;var r=size/2-12,c=2*Math.PI*r,cx=size/2,cls=p>=PASS?'good':p>=60?'mid':'low';
  return '<svg class="donut '+cls+'" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="'+p+' por ciento"><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--br)" stroke-width="12"/><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*p/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/><text x="'+cx+'" y="'+cx+'" text-anchor="middle" dominant-baseline="central" font-size="'+Math.round(size*0.23)+'" font-weight="800" fill="currentColor">'+p+' %</text></svg>';
}
function barRow(label,ok,n){
  var p=pct(ok,n),st=statusOf(p,n);
  return '<li class="brow"><div class="bl"><span class="bn">'+esc(label)+'</span><span class="pill '+st.c+'">'+st.t+'</span></div><div class="bar2"><i class="'+st.c+'" style="width:'+(n?p:0)+'%"></i><u class="mk" style="left:'+PASS+'%"></u></div><div class="bm">'+(n?ok+' de '+n+' correctas · <b>'+p+' %</b>':'Aún no has practicado este tema')+'</div></li>';
}

function statsHTML(){

/* Diálogos propios (los cuadros del navegador pueden estar bloqueados en páginas incrustadas) */
function dlg(msg,onOk,okLabel,cancel){ui.dlg={msg:msg,onOk:onOk,ok:okLabel||'Aceptar',cancel:cancel!==false};renderDlg();}
function renderDlg(){
  var old=document.querySelector('.dlg');if(old)old.remove();
  if(!ui.dlg)return;
  var d=document.createElement('div');d.className='dlg';
  d.innerHTML='<div class="dlg-b" role="alertdialog" aria-modal="true"><p>'+esc(ui.dlg.msg)+'</p><div class="nav">'+(ui.dlg.cancel?'<button class="btn ghost" data-action="dlgno">Cancelar</button>':'')+'<button class="btn primary" data-action="dlgyes">'+esc(ui.dlg.ok)+'</button></div></div>';
  document.body.appendChild(d);
}
function startSession(qs,mode){
  if(!qs.length){dlg('No hay preguntas en los temas elegidos. Marca al menos un tema con preguntas.',null,'Entendido',false);return;}
  var p=PROFMAP[S.profile];
  ui.session={items:qs.map(function(q){return {q:q,order:shuffle(range(q.opts.length)),picked:null};}),i:0,mode:mode,profile:S.profile,pname:p.short,deadline:mode==='exam'?Date.now()+qs.length*60000:0,done:false,t0:Date.now()};
  tel('start',{prof:S.profile,mode:mode,n:qs.length});
  ui.view='quiz';render();window.scrollTo(0,0);startTimer();
}
var timerId=null;
function startTimer(){
  stopTimer();var s=ui.session;if(!s||s.mode!=='exam')return;
  timerId=setInterval(function(){
    var left=Math.max(0,Math.round((s.deadline-Date.now())/1000)),el=document.getElementById('timer');
    if(el)el.textContent=Math.floor(left/60)+':'+('0'+left%60).slice(-2);
    if(left<=0){stopTimer();finish();}
  },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

function quizHTML(){
  var s=ui.session,it=s.items[s.i],q=it.q,n=q.opts.length,ans=it.picked!=null,fb=s.mode==='practice'&&ans,last=s.i===s.items.length-1;
  var answered=s.items.filter(function(x){return x.picked!=null;}).length;
  var opts=it.order.map(function(oi,j){
    var cls='opt';
    if(ans&&s.mode==='practice'){if(oi===q.ans)cls+=' ok';else if(oi===it.picked)cls+=' bad';cls+=' lock';}
    else if(ans&&oi===it.picked)cls+=' sel';
    return '<button class="'+cls+'" data-action="pick" data-j="'+j+'"'+(fb?' disabled':'')+'><span class="ltr">'+LETTERS[j]+'</span><span class="otx">'+optHTML(q,q.opts[oi])+'</span></button>';
  }).join('');
  var timer=s.mode==='exam'?'<span class="timer" title="Tiempo restante">⏱ <b id="timer">'+(function(){var l=Math.max(0,Math.round((s.deadline-Date.now())/1000));return Math.floor(l/60)+':'+('0'+l%60).slice(-2);})()+'</b></span>':'';
  var fbh='';
  if(fb){var okk=it.picked===q.ans;fbh='<div class="fb '+(okk?'good':'bad')+'" role="status"><b>'+(okk?'¡Correcto!':'Incorrecto')+'</b>'+(okk?'':' La respuesta es la '+LETTERS[it.order.indexOf(q.ans)]+'.')+(q.exp?'<p>'+esc(q.exp)+'</p>':'')+refHTML(q)+'</div>';}
  var dots=s.items.map(function(x,k){var c=x.picked==null?'':(s.mode==='practice'?(x.picked===x.q.ans?' g':' r'):' a');return '<i class="dot'+(k===s.i?' cur':'')+c+'"></i>';}).join('');
  return '<div class="qbar"><button class="btn ghost sm" data-action="quit">Salir</button><span class="qn">'+(s.i+1)+' / '+s.items.length+'</span>'+timer+'</div><div class="pbar"><i style="width:'+Math.round(answered/s.items.length*100)+'%"></i></div>'+
    '<article class="qcard"><div class="qcat">'+esc(catLabel(q.cat))+(q.imp?' · tu archivo':'')+'</div><h2 class="qt">'+qText(q)+'</h2>'+ctxHTML(q)+'<div class="opts'+(q.figopts?' fig':'')+'" role="group" aria-label="Opciones">'+opts+'</div>'+fbh+'</article>'+
    '<div class="nav"><button class="btn ghost" data-action="prev"'+(s.i===0?' disabled':'')+'>← Anterior</button>'+(last?'<button class="btn primary" data-action="finish">Finalizar</button>':'<button class="btn primary" data-action="next">'+(ans||s.mode==='exam'?'Siguiente →':'Omitir →')+'</button>')+'</div><div class="dots" aria-hidden="true">'+dots+'</div>';
}

function finish(){
  stopTimer();var s=ui.session;if(!s||s.done)return;s.done=true;
  var ok=0,total=s.items.length,per={};
  s.items.forEach(function(it){
    var q=it.q,cor=it.picked===q.ans;
    if(it.picked!=null){bump(q.cat,cor);}
    if(cor)ok++;
    var pc=per[q.cat]||(per[q.cat]={ok:0,n:0});pc.n++;if(cor)pc.ok++;
    var wi=-1;S.wrong.forEach(function(w,k){if(w.id===q.id)wi=k;});
    if(it.picked!=null&&!cor){if(wi<0)S.wrong.push(q);}else if(cor&&wi>-1){S.wrong.splice(wi,1);}
  });
  if(S.wrong.length>300)S.wrong=S.wrong.slice(-300);
  var p=pct(ok,total);
  var res={t:Date.now(),mode:s.mode,profile:s.profile,pname:s.pname,user:userName(),ced:CUR?CUR.mask:'',total:total,ok:ok,pct:p,pass:p>=PASS};
  S.history.push(res);if(S.history.length>40)S.history=S.history.slice(-40);
  var tc={};Object.keys(per).forEach(function(c){tc[c]=[per[c].ok,per[c].n];});
  tel('session',{prof:s.profile,mode:s.mode,total:total,ok:ok,pct:p,pass:p>=PASS,secs:Math.round((Date.now()-(s.t0||Date.now()))/1000),cats:tc});
  saveState();
  ui.result={res:res,per:per,items:s.items};ui.view='results';render();window.scrollTo(0,0);
}
function resultsHTML(){
  var r=ui.result,res=r.res,passed=res.pct>=PASS,need=Math.max(0,Math.ceil(res.total*PASS/100)-res.ok);
  var cls=passed?'good':res.pct>=60?'mid':'low';
  var head='<header class="top"><h1>Resultado</h1><p>'+esc(res.user||'')+(res.ced?' ('+esc(res.ced)+')':'')+(res.user?' · ':'')+esc(res.pname)+' · '+(res.mode==='exam'?'Simulacro':'Práctica')+' · '+new Date(res.t).toLocaleDateString('es-EC')+'</p></header>';
  var msg=passed?'¡Muy bien'+(CUR?', '+esc(CUR.n):'')+'! Superaste la meta del '+PASS+' %.':'Te faltaron <b>'+need+'</b> respuesta'+(need===1?'':'s')+' correcta'+(need===1?'':'s')+' para llegar al '+PASS+' %. Revisa la guía de repaso y vuelve a intentarlo.';
  var score='<section class="card score"><div class="donwrap">'+donutSVG(res.pct,150)+'</div><p class="verdict"><span class="pill big '+(passed?'good':'low')+'">'+(passed?'APROBADO':'NO APROBADO')+'</span></p><p><b>'+res.ok+'</b> de <b>'+res.total+'</b> correctas · meta '+PASS+' %</p><p class="muted">'+msg+'</p></section>';
  var cats=Object.keys(r.per).sort(function(a,b){return pct(r.per[a].ok,r.per[a].n)-pct(r.per[b].ok,r.per[b].n);});
  var per='<section class="card"><h3>Resultado por tema (del más bajo al más alto)</h3>'+legendHTML()+'<ul class="blist">'+cats.map(function(c){return barRow(catLabel(c),r.per[c].ok,r.per[c].n);}).join('')+'</ul></section>';
  var wrong=r.items.filter(function(it){return it.picked!==it.q.ans;});
  var guide=wrong.length?'<section class="card"><h3>Dónde repasar</h3><p class="muted small">Estas son las fuentes de las preguntas que debes corregir, de la que más te falló a la que menos.</p><ul class="guide">'+whereToStudy(wrong)+'</ul></section>':'';
  var det=wrong.length?'<section class="card"><h3>Preguntas por corregir ('+wrong.length+')</h3>'+wrong.map(function(it){var q=it.q;return '<div class="rv"><div class="qcat">'+esc(catLabel(q.cat))+'</div><p class="qt s">'+qText(q)+'</p>'+ctxHTML(q)+'<p class="ans"><b>Correcta:</b> <span class="ansx">'+optHTML(q,q.opts[q.ans])+'</span></p>'+(it.picked!=null?'<p class="yours"><b>Tu respuesta:</b> <span class="ansx">'+optHTML(q,q.opts[it.picked])+'</span></p>':'<p class="yours">No respondida</p>')+(q.exp?'<p class="exp">'+esc(q.exp)+'</p>':'')+refHTML(q)+'</div>';}).join('')+'</section>':'<section class="card"><p>¡Sin errores en este intento!</p></section>';
  return head+score+per+guide+det+'<div class="nav stack"><button class="btn primary" data-action="home">Volver al inicio</button><button class="btn ghost" data-action="stats">Ver mi progreso</button></div>';
}

/* ---------- Cuestionario de competencias ---------- */
var LK_OPT=['Totalmente en desacuerdo','En desacuerdo','Ni de acuerdo ni en desacuerdo','De acuerdo','Totalmente de acuerdo'];
function likertHTML(){
  var L=ui.lk;
  if(L.i<0)return '<header class="top"><h1>Cuestionario de competencias</h1><p>Autoevaluación sin respuestas correctas</p></header><section class="card"><p>Responde con sinceridad qué tan de acuerdo estás con cada afirmación (40 en total, unos 8 minutos). Al final verás tu perfil en 8 competencias con consejos para reforzarlas.</p><p class="muted small">Es una herramienta de práctica y reflexión, no una prueba psicológica ni un diagnóstico. En pruebas reales conviene responder con naturalidad y coherencia; la sinceridad da resultados más útiles para ti.</p><div class="nav stack"><button class="btn primary big" data-action="lkstart">Comenzar</button><button class="btn ghost" data-action="home">Volver</button></div></section>';
  if(L.i>=LIKERT.length){
    var sc={};COMPS.forEach(function(c){sc[c.id]={s:0,n:0};});
    LIKERT.forEach(function(it,k){var v=L.ans[k];if(v==null)return;if(it[2])v=6-v;sc[it[0]].s+=v;sc[it[0]].n++;});
    var rows=COMPS.map(function(c){var x=sc[c.id],p=x.n?Math.round((x.s/x.n-1)/4*100):0;return {c:c,p:p};});
    S.likert={t:Date.now(),scores:rows.map(function(r){return [r.c.id,r.p];})};saveState();
    if(!L.sent){L.sent=1;var ls={};rows.forEach(function(r){ls[r.c.id]=r.p;});tel('likert',{scores:ls});}
    var low=rows.slice().sort(function(a,b){return a.p-b.p;}).slice(0,3);
    return '<header class="top"><h1>Tu perfil de competencias</h1><p>Autoevaluación</p></header><section class="card"><ul class="per">'+rows.map(function(r){return '<li><span>'+esc(r.c.name)+'</span><div class="bar"><i class="'+(r.p>=75?'good':r.p>=55?'mid':'low')+'" style="width:'+r.p+'%"></i></div><b>'+r.p+'</b></li>';}).join('')+'</ul><p class="muted small">Escala de 0 a 100. Por encima de 75: fortaleza; de 55 a 75: adecuado; por debajo de 55: conviene reforzar.</p></section><section class="card"><h3>Para reforzar primero</h3>'+low.map(function(r){return '<p><b>'+esc(r.c.name)+':</b> '+esc(r.c.tip)+'</p>';}).join('')+'<p class="muted small">Practica también el tema «Juicio situacional» para entrenar la toma de decisiones en escenarios laborales.</p></section><div class="nav stack"><button class="btn primary" data-action="home">Volver al inicio</button><button class="btn ghost" data-action="lkstart">Repetir</button></div>';
  }
  var it=LIKERT[L.i],cur=L.ans[L.i];
  return '<div class="qbar"><button class="btn ghost sm" data-action="home">Salir</button><span class="qn">'+(L.i+1)+' / '+LIKERT.length+'</span></div><div class="pbar"><i style="width:'+Math.round(L.i/LIKERT.length*100)+'%"></i></div><article class="qcard"><div class="qcat">Autoevaluación</div><h2 class="qt">'+esc(it[1])+'</h2><div class="opts" role="group">'+LK_OPT.map(function(t,j){return '<button class="opt'+(cur===j+1?' sel':'')+'" data-action="lkpick" data-v="'+(j+1)+'"><span class="ltr">'+(j+1)+'</span><span class="otx">'+t+'</span></button>';}).join('')+'</div></article><div class="nav"><button class="btn ghost" data-action="lkprev"'+(L.i===0?' disabled':'')+'>← Anterior</button><span></span></div>';
}

/* ---------- Render ---------- */
function render(){
  if(!$app)$app=document.getElementById('app');
  var html='';
  if(!CUR&&ui.view!=='admin')ui.view='auth';
  if(ui.view==='admin')html=adminHTML();
  else if(ui.view==='auth')html=authHTML();
  else if(ui.view==='account')html=accountHTML();
  else if(ui.view==='home')html=homeHTML();
  else if(ui.view==='quiz')html=quizHTML();
  else if(ui.view==='results')html=resultsHTML();
  else if(ui.view==='likert')html=likertHTML();
  else if(ui.view==='stats')html=statsHTML();
  $app.innerHTML=html;
  renderModal();
  renderConsent();
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-action]'):null;if(!t)return;
  var a=t.getAttribute('data-action'),id=t.getAttribute('data-id');
  var p=PROFMAP[S.profile];
  if(telClick(a,t,id))return;
  if(a==='profile'){S.profile=id;saveState();render();}
  else if(a==='tog'){return;}
  else if(a==='preset'){
    var pr=p.presets.filter(function(x){return x.id===id;})[0];
    if(id==='none')S.sel[S.profile]=[];
    else S.sel[S.profile]=(pr&&pr.cats?pr.cats.slice():p.allCats.filter(hasContent));
    S.sel[S.profile]=S.sel[S.profile].filter(hasContent);saveState();render();
  }
  else if(a==='files'){ui.modal=id;ui.msg='';ui.busy=false;renderModal();}
  else if(a==='closemodal'){ui.modal=null;ui.msg='';render();}
  else if(a==='rmfile'){removeFile(id,+t.getAttribute('data-i'));}
  else if(a==='count'){S.count=id==='all'?'all':+id;saveState();render();}
  else if(a==='mode'){S.mode=id;saveState();render();}
  else if(a==='authced'){
    var c=((document.getElementById('uCed')||{}).value||'').replace(/\D/g,''),rem=!!(document.getElementById('uRem')||{}).checked;
    ui.auth.rem=rem;ui.auth.ced=c;
    if(c.length!==10){ui.auth.err='La cédula debe tener 10 dígitos.';render();return;}
    if(!validCedula(c)){ui.auth.err='Esa cédula no es válida. Revisa los números.';render();return;}
    var id=userIdOf(c);
    if(U.users[id]){openUser(id);U.last=rem?id:null;saveIndex();ui.auth={step:'ced',ced:'',rem:false,err:''};render();window.scrollTo(0,0);}
    else{ui.auth={step:'new',ced:c,rem:rem,err:'',n:'',a:''};render();}
  }
  else if(a==='authback'){ui.auth={step:'ced',ced:'',rem:ui.auth.rem,err:''};render();}
  else if(a==='authnew'){
    var A=ui.auth,g=function(i){return ((document.getElementById(i)||{}).value||'');};
    var n=g('uName').replace(/\s+/g,' ').trim(),ap=g('uLast').replace(/\s+/g,' ').trim(),p1=g('uPin'),p2=g('uPin2');
    A.n=n;A.a=ap;
    if(n.length<2||ap.length<2){A.err='Escribe tu nombre y tu apellido (mínimo 2 letras cada uno).';render();return;}
    if(!/^\d{4,6}$/.test(p1)){A.err='El PIN debe tener de 4 a 6 números.';render();return;}
    if(p1!==p2){A.err='Los dos PIN no coinciden.';render();return;}
    var nid=userIdOf(A.ced);
    if(U.users[nid]){A.err='Esa cédula ya tiene usuario.';render();return;}
    U.users[nid]={n:n,a:ap,mask:maskCed(A.ced),ph:pinHash(nid,p1),t:Date.now()};
    if(A.rem)U.last=nid;
    var claim=!!(document.getElementById('uLegacy')||{}).checked,old=null;
    if(claim){try{old=JSON.parse(localStorage.getItem(KEY_OLD)||'null');}catch(e){old=null;}}
    saveIndex();openUser(nid,true);
    if(old){for(var k in old){if(k!=='user')S[k]=old[k];}normalizeState();try{localStorage.removeItem(KEY_OLD);}catch(e){}}
    saveState();ui.auth={step:'ced',ced:'',rem:false,err:''};render();window.scrollTo(0,0);
  }
  else if(a==='logout'){if(U.last){U.last=null;saveIndex();}closeUser();render();window.scrollTo(0,0);}
  else if(a==='account'){ui.view='account';ui.msg='';render();window.scrollTo(0,0);}
  else if(a==='savename'){
    var n2=((document.getElementById('uName')||{}).value||'').replace(/\s+/g,' ').trim(),a2=((document.getElementById('uLast')||{}).value||'').replace(/\s+/g,' ').trim();
    if(n2.length<2||a2.length<2){ui.msg='Escribe nombre y apellido (mínimo 2 letras cada uno).';render();return;}
    CUR.n=n2;CUR.a=a2;if(U.users[CUR.id]){U.users[CUR.id].n=n2;U.users[CUR.id].a=a2;saveIndex();}ui.msg='Nombre actualizado.';render();
  }
  else if(a==='deluser'){ui.pin={err:''};renderPin();}
  else if(a==='pinno'){ui.pin=null;renderPin();}
  else if(a==='pinyes'){
    var pv=((document.getElementById('uPinDel')||{}).value||''),rec=U.users[CUR.id];
    if(!rec){ui.pin=null;renderPin();return;}
    if(rec.lock&&rec.lock>Date.now()){ui.pin={err:'Bloqueado por intentos fallidos. Inténtalo de nuevo en '+Math.ceil((rec.lock-Date.now())/60000)+' minuto(s).'};renderPin();return;}
    if(pinHash(CUR.id,pv)!==rec.ph){
      rec.f=(rec.f||0)+1;var left=5-rec.f;
      if(rec.f>=5){rec.lock=Date.now()+10*60000;rec.f=0;ui.pin={err:'Demasiados intentos fallidos. Se bloqueó la eliminación por 10 minutos.'};}
      else ui.pin={err:'PIN incorrecto. Intentos restantes: '+left+'.'};
      saveIndex();renderPin();return;
    }
    var did=CUR.id;var rr=U.users[did];if(rr&&rr.cons&&rr.cons.v!==undefined)deleteRemote(did);
    try{localStorage.removeItem(DKEY+did);}catch(e){}
    delete U.users[did];if(U.last===did)U.last=null;saveIndex();ui.pin=null;
    closeUser('Tu usuario y todos sus datos fueron eliminados de este dispositivo.');render();window.scrollTo(0,0);
  }
  else if(a==='stats'){ui.view='stats';render();window.scrollTo(0,0);}
  else if(a==='statsprio'){
    var pp=PROFMAP[S.profile],lows=[];
    pp.allCats.forEach(function(c){var x=S.cats[c];if(x&&x.seen>=5&&pct(x.ok,x.seen)<PASS)lows.push({c:c,p:pct(x.ok,x.seen)});});
    lows.sort(function(x,y){return x.p-y.p;});var lc=lows.slice(0,3).map(function(x){return x.c;});
    if(lc.length){S.sel[S.profile]=lc;S.mode='practice';saveState();startSession(buildQuestions(lc,S.count==='all'?30:Math.max(20,S.count)),'practice');}
  }
  else if(a==='resetstats'){dlg('¿Borrar todo tu progreso (estadísticas, historial y errores guardados)? Tus archivos y tu nombre se conservan.',function(){S.cats={};S.history=[];S.wrong=[];saveState();render();},'Borrar');}
  else if(a==='start'){
    var cats=selectedCats();startSession(buildQuestions(cats,S.count),S.mode);}
  else if(a==='review'){startSession(shuffle(S.wrong.slice()),'practice');}
  else if(a==='pick'){
    var s=ui.session,it=s.items[s.i],j=+t.getAttribute('data-j');
    if(s.mode==='practice'&&it.picked!=null)return;
    it.picked=it.order[j];render();
  }
  else if(a==='next'){ui.session.i=Math.min(ui.session.items.length-1,ui.session.i+1);render();window.scrollTo(0,0);}
  else if(a==='prev'){ui.session.i=Math.max(0,ui.session.i-1);render();window.scrollTo(0,0);}
  else if(a==='finish'){
    var un=ui.session.items.filter(function(x){return x.picked==null;}).length;
    if(un)dlg('Tienes '+un+' pregunta(s) sin responder. ¿Finalizar de todos modos?',finish,'Finalizar');
    else finish();
  }
  else if(a==='quit'){dlg('¿Salir? Se perderá este intento.',function(){stopTimer();ui.view='home';render();window.scrollTo(0,0);},'Salir');}
  else if(a==='dlgyes'){var f=ui.dlg&&ui.dlg.onOk;ui.dlg=null;renderDlg();if(f)f();}
  else if(a==='dlgno'){ui.dlg=null;renderDlg();}
  else if(a==='home'){stopTimer();ui.view='home';ui.lk=null;render();window.scrollTo(0,0);}
  else if(a==='likert'){ui.lk={i:-1,ans:[]};ui.view='likert';render();window.scrollTo(0,0);}
  else if(a==='lkstart'){ui.lk={i:0,ans:[]};ui.view='likert';render();window.scrollTo(0,0);}
  else if(a==='lkpick'){ui.lk.ans[ui.lk.i]=+t.getAttribute('data-v');ui.lk.i++;render();window.scrollTo(0,0);}
  else if(a==='lkprev'){ui.lk.i=Math.max(0,ui.lk.i-1);render();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-action')==='tog'){
    var sel=selectedCats().slice(),id=t.getAttribute('data-id'),i=sel.indexOf(id);
    if(t.checked&&i<0)sel.push(id);if(!t.checked&&i>-1)sel.splice(i,1);
    S.sel[S.profile]=sel;saveState();render();
  }
  else if(t&&t.id==='fileIn'){var fs=t.files;handleFiles(fs);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}
  if(e.key==='Enter'&&e.target){var tid=e.target.id,act=tid==='aKey'?'admlogin':tid==='uCed'?'authced':(tid==='uPin2'?'authnew':(tid==='uPinDel'?'pinyes':''));if(act){var bb=document.querySelector('[data-action='+act+']');if(bb)bb.click();}}
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.id==='aQ'){ui.adm.q=t.value;var el=document.getElementById('aTable');if(el&&ui.adm.data)el.innerHTML=usersTableHTML(admKPI(ui.adm.data));}
});
/* ---------- Inicio ---------- */
function boot(){loadIndex();$app=document.getElementById('app');if(U.last&&U.users[U.last])openUser(U.last);render();tFlush();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

})();
