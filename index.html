Q('arch','El archivo central o intermedio recibe:','Los documentos transferidos desde los archivos de gestión, cuya consulta ya es menos frecuente, hasta cumplir su plazo de conservación','Documentos en trámite','Los documentos históricos','Solo documentos electrónicos','Guarda los documentos durante el plazo de conservación definido.');
Q('arch','La tabla o calendario de plazos de conservación documental define:','Cuánto tiempo se conserva cada serie documental y su destino final (conservación o eliminación)','La ubicación de los archivos','El costo de los archivos','El color de las carpetas','Es una herramienta de gestión documental esencial.');
Q('arch','Una serie documental es:','Un conjunto de documentos producidos por una unidad en ejercicio de una misma función y con la misma estructura','Un solo documento','Cualquier lote de papeles','Un archivo electrónico','Ejemplo: la serie «contratos», «actas de sesión» o «expedientes de causas».');
Q('arch','El expediente es:','El conjunto ordenado de documentos relacionados con un mismo asunto, trámite o proceso','Un documento suelto','Un libro','Un sobre','En el TCE, cada causa se conforma como expediente.');
Q('arch','La foliación consiste en:','Numerar las hojas (folios) de un expediente en orden consecutivo, en la esquina superior derecha del anverso','Numerar las carpetas','Numerar las estanterías','Escribir el nombre del archivo','Ordena y garantiza la integridad de las piezas.');
Q('arch','El valor primario de un documento se refiere a:','Su valor administrativo, legal, fiscal o contable para la entidad que lo produjo','Su valor histórico','Su costo de papel','Su tamaño','El valor secundario es el valor histórico o informativo, útil para la investigación.');
Q('arch','La clasificación documental consiste en:','Identificar y establecer las series y agrupaciones documentales según la estructura y funciones de la entidad','Eliminar documentos','Escanear documentos','Numerar páginas','Da un orden lógico al fondo documental.');
Q('arch','La ordenación documental es:','Disponer los documentos dentro de cada serie según un criterio (alfabético, numérico, cronológico, geográfico)','Separar los originales de las copias','Cambiar el formato','Clasificar por color','Facilita la recuperación de la información.');
Q('arch','La descripción archivística permite:','Identificar, localizar y explicar el contenido de los documentos mediante instrumentos como inventarios y catálogos','Borrar documentos','Escanear archivos','Guardar copias','Es la base para recuperar y difundir el contenido.');
Q('arch','La transferencia primaria es:','El paso de documentos del archivo de gestión al archivo central','El paso del archivo central al histórico','La eliminación de documentos','La digitalización','La transferencia secundaria lleva los documentos con valor permanente al archivo histórico.');
Q('arch','La eliminación de documentos en una entidad pública:','Solo procede tras cumplirse los plazos de conservación y con la autorización correspondiente','Puede hacerla cualquier servidor','Depende del criterio del jefe','No existe','Se debe seguir el procedimiento formal y dejar constancia (acta de eliminación).');
Q('arch','La Ley del Sistema Nacional de Archivos declara que los documentos públicos forman parte de:','El Patrimonio Documental del Estado','El patrimonio personal de los servidores','Un fondo privado','Bienes sin protección','La ley protege los documentos como patrimonio del Estado.');
Q('arch','En una entidad pública, la responsabilidad de la gestión documental recae, según la normativa técnica, en:','La Secretaría General o la unidad de gestión documental y archivo, o quien haga sus veces','Cada servidor por separado sin coordinación','Solo el área de Talento Humano','El área de compras','Es la unidad que coordina la gestión documental institucional.');
Q('arch','Un documento de archivo confiable debe tener, entre otras características:','Autenticidad, integridad, fiabilidad y disponibilidad','Solo tamaño estándar','Solo firma','Solo sello','Son características de los documentos de archivo según normas internacionales (por ejemplo, ISO 15489).');
Q('arch','Los documentos electrónicos con firma electrónica válida:','Tienen valor jurídico equivalente al de los documentos escritos, conforme a la ley de comercio electrónico','No tienen validez legal','Solo valen si se imprimen','Requieren siempre notarización','La Ley de Comercio Electrónico reconoce valor jurídico a los mensajes de datos.');
Q('arch','Los metadatos de un documento electrónico son:','Datos que describen su contexto, contenido y estructura, como autor, fecha, tipo y serie','El contenido del documento','La contraseña','El tamaño de la pantalla','Permiten identificar, gestionar y recuperar los documentos.');
Q('arch','El préstamo de expedientes a personal autorizado debe:','Registrarse con constancia de salida, responsable y fecha de devolución','Hacerse verbalmente','Realizarse sin registro','Prohibirse siempre','El control garantiza la trazabilidad y la seguridad del expediente.');
Q('arch','Para conservar documentos en papel, un depósito de archivo debe:','Mantener temperatura y humedad controladas, evitar la luz solar directa y proteger de plagas y del agua','Guardar los documentos en el piso','Exponerlos a la luz','Almacenarlos en cajas abiertas','La conservación preventiva evita el deterioro físico.');

/* ===================== GESTIÓN DE EXPEDIENTES Y SECRETARÍA GENERAL ===================== */
Q('exped','La fe pública de la Secretaría General significa que:','El secretario o la secretaria certifica la autenticidad de las actuaciones, documentos y resoluciones del órgano','Puede modificar las decisiones','Puede resolver las causas','Solo custodia la llave','Da certeza jurídica a lo actuado.');

Q('exped','En el TCE, la razón de sorteo de una causa la suscribe:','El Secretario o Secretaria General','El Presidente del CNE','El demandante','El juez sorteado','El sorteo garantiza la asignación aleatoria e imparcial del juez.');
Q('exped','Una causa del TCE se identifica, por ejemplo, con la numeración:','Número secuencial, año y siglas TCE (como 181-2019-TCE)','Solo un nombre','El RUC del demandante','La fecha de la audiencia','La identificación uniforme facilita el seguimiento.');
Q('exped','Una razón sentada por el secretario es:','Una constancia escrita de un hecho o actuación procesal, como recepción de un escrito o notificación','Una sentencia','Una multa','Un recurso','Deja evidencia con fecha y hora.');
Q('exped','La providencia es:','Una resolución de trámite que impulsa el proceso sin decidir el fondo','La sentencia final','Una queja','Un recurso','Ordena, por ejemplo, agregar un escrito, correr traslado o convocar a audiencia.');
Q('exped','La sentencia es:','La resolución que decide el fondo de la controversia','Un escrito de trámite','Una notificación','Un oficio','Es la decisión final sobre el asunto litigioso.');
Q('exped','Al recibir un escrito, la Secretaría debe:','Dejar constancia de la fecha y hora de recepción y agregarlo al expediente','Guardarlo sin registro','Devolverlo siempre','Esperar a fin de mes','La constancia de recepción es crucial para el cómputo de plazos.');
Q('exped','Al armar un expediente se debe:','Ordenarlo cronológicamente, foliarlo y mantener la integridad de todas las piezas','Mezclarlo con otros','Retirar las hojas antiguas','Guardarlo sin identificar','Facilita su consulta y garantiza su integridad.');
Q('exped','Una certificación de copias:','Da fe de que una copia es fiel a su original que reposa en el expediente','Modifica el original','Crea un documento nuevo','Sustituye la sentencia','La emite quien tiene fe pública para ello.');
Q('exped','La información de los expedientes que tiene carácter reservado:','Debe custodiarse y entregarse solo a quienes la ley autoriza','Se publica en redes sociales','Se entrega a cualquier persona','Se guarda en un lugar abierto','La reserva protege derechos y el debido proceso.');
Q('exped','El acta de una sesión del Pleno debe contener, en general:','Fecha, asistentes, orden del día, resoluciones adoptadas y firmas de quienes presiden y del secretario','Solo la fecha','Las notas personales de los jueces','Los chats de los asistentes','El acta es el documento oficial de lo actuado.');
Q('exped','El orden del día es:','La lista de los asuntos que se tratarán en una sesión','El horario del personal','El acta anterior','Un informe de gestión','Se comunica en la convocatoria y guía el debate.');
Q('exped','El quórum es:','El número mínimo de miembros presentes para que un órgano colegiado pueda sesionar y decidir válidamente','El total de votos','Un acta','Un resumen','Sin quórum, las decisiones podrían ser inválidas.');

/* ===================== HABILIDAD ANALÍTICA ===================== */
QC('anal','«Todos los expedientes con firma electrónica se archivan digitalmente. Este expediente no tiene firma electrónica.»','¿Qué conclusión es válida?','No se puede concluir que se archive digitalmente por esa causa','Se archiva en papel obligatoriamente','No se archiva','Se archiva digitalmente','La premisa dice qué ocurre con los expedientes con firma electrónica; de su ausencia no se deduce nada respecto de los demás.');
QC('anal','«Si el recurso se presenta fuera del plazo, se inadmite. El recurso fue admitido.»','¿Qué se puede concluir?','El recurso se presentó dentro del plazo','El recurso se presentó fuera del plazo','Se admitió por ser urgente','No se puede saber nada','Contrarrecíproca: si «fuera de plazo → inadmisión», entonces «no inadmitido → no fuera de plazo».');
QC('anal','«Todos los funcionarios que asistieron a la capacitación aprobaron. Ana aprobó.»','Sobre Ana, ¿qué se puede afirmar con seguridad?','Nada acerca de si asistió','Que asistió','Que no asistió','Que aprobó por ser funcionaria','Aprobar no implica haber asistido: es una falacia inferir la premisa a partir de la conclusión.');
QC('anal','«No debemos confiar en la propuesta de Luis porque llegó tarde a la reunión.»','¿Qué falacia contiene?','Ad hominem: ataca a la persona en lugar del argumento','Falsa dicotomía','Generalización apresurada','Pendiente resbaladiza','Llegar tarde no invalida el contenido de la propuesta.');
QC('anal','«O implementamos el nuevo sistema hoy o la institución fracasará.»','¿Qué falacia contiene?','Falsa dicotomía: presenta solo dos opciones cuando existen otras','Ad hominem','Apelación a la autoridad','Causa falsa','Ignora alternativas intermedias.');
QC('anal','«Dos usuarios se quejaron del sistema; por lo tanto, todos los usuarios están insatisfechos.»','¿Qué error de razonamiento aparece?','Generalización apresurada','Ad hominem','Falsa dicotomía','Petición de principio','Se generaliza a partir de una muestra insuficiente.');
QC('anal','«Cada vez que aumentan las ventas de helados, aumentan los ahogamientos.»','¿Qué conclusión es la más razonable?','Ambas variables pueden depender de una tercera, como el calor; correlación no implica causalidad','Los helados causan ahogamientos','Los ahogamientos causan el consumo de helados','No hay relación alguna','La estación calurosa aumenta ambas cosas.');
QC('anal','«Debemos contratar a Marta porque tiene más experiencia que los demás candidatos. Además, la experiencia es lo más importante para el cargo.»','¿Cuál es la conclusión del argumento?','Debemos contratar a Marta','La experiencia es importante','Marta es simpática','Los demás no tienen experiencia','La conclusión es lo que se quiere demostrar; las demás son premisas.');
QC('anal','«La biblioteca debe ampliar su horario porque los usuarios piden atención en la tarde.»','¿Cuál es un supuesto implícito del argumento?','Que ampliar el horario resolverá la demanda de atención en la tarde','Que la biblioteca es grande','Que los libros son caros','Que nadie leerá en la mañana','Un supuesto es una premisa no expresada pero necesaria.');
QC('anal','«Aumentar la vigilancia en la sala de archivo reducirá las pérdidas de documentos.»','¿Qué dato debilitaría más este argumento?','Las pérdidas ocurren por errores de clasificación y no por robo','La sala es amplia','Hay cámaras nuevas','El archivo es antiguo','Si la causa es otra, más vigilancia no resuelve el problema.');
QC('anal','«Capacitar al personal en atención mejora la satisfacción del usuario.»','¿Qué dato fortalecería más esta afirmación?','Tras la capacitación, la satisfacción subió en las oficinas que la recibieron y no en las demás','Los cursos duraron dos días','El personal viajó a la capital','El instructor es joven','Una comparación con grupo de control apoya la relación causal.');
QC('anal','Texto: «El uso de expedientes digitales reduce el tiempo de búsqueda, pero exige inversión en seguridad y capacitación.»','¿Cuál es la mejor síntesis?','Los expedientes digitales ahorran tiempo pero requieren seguridad y formación','Los expedientes digitales no sirven','Los expedientes en papel son mejores','Solo importa el costo','Una buena síntesis recoge la idea central y la condición.');
QC('anal','Una servidora tiene tres tareas: (a) urgente e importante, (b) importante pero no urgente, (c) urgente pero poco importante.','¿En qué orden conviene atenderlas?','a, b, c','c, b, a','b, c, a','a, c, b','Se prioriza lo urgente e importante, luego lo importante y planificado, y por último lo urgente poco importante (o delegable).');
QC('anal','Un informe indica que el 60 % de las quejas se concentra en el mismo trámite.','¿Cuál sería la mejor acción analítica inicial?','Analizar las causas de ese trámite específico','Cambiar a todo el personal','Ignorar las quejas','Eliminar el trámite sin estudiarlo','El principio de Pareto orienta a concentrarse en lo que más peso tiene.');
QC('anal','Se detecta que los expedientes tardan en notificarse.','Para hallar la causa raíz se puede:','Preguntar «¿por qué?» de forma sucesiva hasta llegar a la causa de fondo','Culpar al último servidor','Cambiar el formulario sin analizar','Esperar a que se resuelva solo','La técnica de los cinco porqués ayuda a encontrar la causa raíz.');
QC('anal','Un texto afirma: «Un experto dijo que este método es el mejor, así que es el mejor».','¿Qué debilidad tiene este argumento?','Apela a la autoridad sin presentar evidencia','Es una falsa dicotomía','Es una generalización','Usa lenguaje formal','La opinión de un experto no reemplaza la evidencia.');

/* ===================== JUICIO SITUACIONAL (PSICOSOCIAL) ===================== */
Q('psico','Un compañero de su equipo cometió un error en un informe que se entrega mañana. Usted lo nota. ¿Qué hace?','Se lo comunica de inmediato y le ofrece ayuda para corregirlo antes de la entrega','Lo corrige sin avisarle','Se lo comenta al jefe delante de todos','Espera a que otros lo descubran','Competencia: trabajo en equipo y comunicación. Informar directamente y colaborar protege al equipo y la calidad.');
Q('psico','Su jefe le pide una tarea urgente cuando usted ya tiene otro plazo comprometido para hoy. ¿Qué hace?','Le explica sus prioridades actuales y acuerda con él el orden o el apoyo necesario','Acepta sin decir nada y entrega tarde ambas','Rechaza la tarea nueva sin dar razones','Hace la nueva y abandona la anterior sin avisar','Competencia: organización y comunicación. Aclarar prioridades evita incumplimientos.');
Q('psico','Un proveedor le ofrece un regalo costoso mientras tiene un trámite pendiente con su área. ¿Qué hace?','Lo rechaza con cortesía y lo informa a su superior si el ofrecimiento es insistente','Lo acepta porque es una muestra de gratitud','Lo acepta y se lo reparte con el equipo','Lo deja en la oficina sin decir nada','Competencia: ética e integridad. Recibir dádivas de quienes tienen intereses en su gestión compromete la imparcialidad.');
Q('psico','Le asignan una tarea para la que no tiene experiencia. ¿Qué hace?','Pide orientación, revisa material disponible y avisa el tiempo que necesitará para aprender','Acepta y la hace a ciegas','Se niega a hacerla','La transfiere a un compañero sin avisar','Competencia: aprendizaje y responsabilidad.');
Q('psico','Dos compañeros discuten sobre cómo repartir el trabajo del equipo y usted está presente. ¿Qué hace?','Propone dialogar con criterios objetivos (cargas, plazos, habilidades) para acordar una repartición justa','Toma partido por su amigo','Se retira sin decir nada','Comenta el conflicto con otros','Competencia: trabajo en equipo y manejo de conflictos.');
Q('psico','Su institución cambia de repente un procedimiento que usted domina. ¿Qué hace?','Pide aclaraciones, se adapta al nuevo procedimiento y propone ajustes si detecta problemas','Sigue usando el procedimiento anterior','Critica el cambio con los compañeros','Se niega a aplicarlo','Competencia: adaptabilidad.');
Q('psico','Usted descubre una posible irregularidad cometida por un superior. ¿Qué hace?','La reporta por los canales formales, con la información que tiene, sin difundirla informalmente','La ignora para evitar problemas','La comenta con los compañeros','Se enfrenta al superior con reproches públicos','Competencia: ética e integridad. La denuncia responsable protege a la institución y a usted.');
Q('psico','Tiene dos plazos que vencen el mismo día y no alcanza a cumplir ambos con calidad. ¿Qué hace?','Prioriza según urgencia e impacto y comunica con anticipación al jefe para acordar apoyo o plazos','Trabaja hasta agotarse sin avisar','Entrega ambos incompletos','Deja uno sin hacer y no dice nada','Competencia: organización y manejo de la presión.');
Q('psico','Al revisar su trabajo ya entregado, descubre un error suyo. ¿Qué hace?','Lo informa de inmediato, propone la corrección y ajusta su método para evitar que se repita','Espera a ver si alguien lo nota','Culpa a un compañero','Lo corrige a escondidas','Competencia: ética y responsabilidad.');

/* ---------- Bancos ---------- */
function importedFiles(cat){return S.imports[cat]||[];}
function importedQs(cat){var out=[];importedFiles(cat).forEach(function(f){f.qs.forEach(function(q){out.push(q);});});return out;}
function nStatic(cat){return (BYCAT[cat]||[]).length;}
function nImported(cat){var n=0;importedFiles(cat).forEach(function(f){n+=f.qs.length;});return n;}
function hasContent(cat){return nStatic(cat)>0||nImported(cat)>0||!!GENS[cat];}
function selectedCats(){
  var p=PROFMAP[S.profile];var sel=S.sel[S.profile];
  if(!sel){sel=p.allCats.filter(hasContent);S.sel[S.profile]=sel;}
  return sel.filter(function(c){return p.allCats.indexOf(c)>-1&&hasContent(c);});
}
function poolForCat(cat,genN){
  var arr=(BYCAT[cat]||[]).concat(importedQs(cat));
  if(GENS[cat])arr=arr.concat(genMany(cat,genN));
  return arr;
}
function buildQuestions(cats,count){
  var per={},total=0;
  var genN=(count==='all')?20:Math.max(12,Math.ceil((+count)/Math.max(1,cats.length))+6);
  cats.forEach(function(c){per[c]=shuffle(poolForCat(c,genN).slice());});
  if(count==='all'){var all=[];cats.forEach(function(c){all=all.concat(per[c]);});return shuffle(all);}
  var n=+count,out=[],idx={},active=cats.filter(function(c){return per[c].length>0;});
  active.forEach(function(c){idx[c]=0;});
  while(out.length<n&&active.length){
    var next=[];
    for(var i=0;i<active.length&&out.length<n;i++){
      var c=active[i];
      if(idx[c]<per[c].length){out.push(per[c][idx[c]++]);if(idx[c]<per[c].length)next.push(c);}
    }
    active=next;shuffle(active);
  }
  return shuffle(out);
}

/* =========================================================
   IMPORTACIÓN DE ARCHIVOS
   ========================================================= */
function normAns(a,opts){
  var n=opts.length;
  if(a==null)return -1;
  if(typeof a==='number'){return (a>=0&&a<n)?a:-1;}
  var s=String(a).trim();
  var m=s.match(/^\(?([A-Fa-f])\)?[\.\)]?$/);if(m){var i=LETTERS.indexOf(m[1].toUpperCase());return i<n?i:-1;}
  for(var k=0;k<n;k++){if(opts[k].trim().toLowerCase()===s.toLowerCase())return k;}
  return -1;
}
function mkQuestion(text,opts,ans,exp,src,i){
  opts=opts.map(function(o){return String(o).trim();}).filter(function(o){return o.length;});
  if(!text||opts.length<2||opts.length>6)return null;
  var a=normAns(ans,opts);if(a<0)return null;
  return {id:'u'+Math.abs(hash(src+'|'+i+'|'+text)).toString(36),text:String(text).trim(),opts:opts,ans:a,exp:exp?String(exp).trim():'',imp:true,src:src};
}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return h;}

/* Preguntas escritas en texto: 1. Pregunta / a) b) c) d) / Respuesta: b / Explicación: ... */
function parseQuestionText(text,src){
  var lines=text.replace(/\r/g,'').split('\n');
  var reOpt=/^\s*\(?([A-Fa-f])[\)\.:\-]\s*(.+)$/;
  var reQ=/^\s*(?:pregunta\s*)?(\d{1,3})\s*[\)\.:\-–]\s*(.+)$/i;
  var reQ2=/^\s*(?:pregunta|p)\s*[:\.\-]\s*(.+)$/i;
  var reAns=/^\s*(?:respuesta(?:\s+correcta)?|rpta\.?|clave|correcta|answer|resp\.?)\s*[:\-=]\s*\(?([A-Fa-f])\b/i;
  var reExp=/^\s*(?:explicaci[oó]n|justificaci[oó]n|retroalimentaci[oó]n|fundamento|sustento)\s*[:\-]\s*(.*)$/i;
  var qs=[],cur=null,last=null,idx=0;
  function fin(){
    if(cur){
      if(cur.ans==null&&cur.mark!=null)cur.ans=cur.mark;
      var q=mkQuestion(cur.q,cur.opts,cur.ans,cur.exp,src,idx++);
      if(q)qs.push(q);
    }
    cur=null;last=null;
  }
  lines.forEach(function(raw){
    var line=raw.replace(/\u00a0/g,' ');if(!line.trim()){return;}
    var m;
    if((m=line.match(reAns))&&cur&&cur.opts.length>=2){cur.ans=LETTERS.indexOf(m[1].toUpperCase());last='ans';return;}
    if((m=line.match(reExp))&&cur){cur.exp=m[1];last='exp';return;}
    if((m=line.match(reOpt))&&cur&&cur.q){
      var t=m[2],mark=false;
      if(/(\(correcta\)|\[correcta\]|✓|✔|\*)\s*$/i.test(t)){mark=true;t=t.replace(/\s*(\(correcta\)|\[correcta\]|✓|✔|\*)\s*$/i,'');}
      if(/^\*/.test(t)){mark=true;t=t.replace(/^\*\s*/,'');}
      cur.opts.push(t);if(mark)cur.mark=cur.opts.length-1;last='opt';return;
    }
    if((m=line.match(reQ))&&(!cur||cur.opts.length>=2||last==='ans'||last==='exp')){fin();cur={q:m[2],opts:[],ans:null,exp:'',mark:null};last='q';return;}
    if((m=line.match(reQ2))){fin();cur={q:m[1],opts:[],ans:null,exp:'',mark:null};last='q';return;}
    if(!cur)return;
    if(last==='q'&&cur.opts.length===0)cur.q+=' '+line.trim();
    else if(last==='opt'&&cur.opts.length)cur.opts[cur.opts.length-1]+=' '+line.trim();
    else if(last==='exp')cur.exp+=' '+line.trim();
  });
  fin();
  return qs;
}

/* CSV */
function parseCSVRows(text){
  var first=text.split('\n')[0]||'';
  var delim=[',',';','\t'].map(function(d){return [d,first.split(d).length];}).sort(function(a,b){return b[1]-a[1];})[0][0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];

/* JSON */

/* Apuntes -> preguntas de completar (automáticas) */
var STOP={que:1,los:1,las:1,del:1,con:1,por:1,para:1,una:1,uno:1,sus:1,este:1,esta:1,estos:1,estas:1,como:1,pero:1,sobre:1,entre:1,desde:1,hasta:1,cuando:1,donde:1,segun:1,tambien:1,cada:1,todos:1,todas:1,otros:1,otras:1,tiene:1,tienen:1,puede:1,pueden:1,deben:1,debe:1,sera:1,seran:1,haya:1,hayan:1,siendo:1,mediante:1,durante:1,cuales:1,cual:1};
var NUMW='uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta|cincuenta|sesenta|noventa|cien|ciento veinte|cinco mil|diez mil';

var RE_ART=/\b(art(?:[ií]culos?|s?\.)\s?\d+[A-Za-z]?)/i;
var RE_CAP=/(?:^|[\s(«"])((?:[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}(?:\s+(?:de|del|la|las|los|y|para|en)\s+)?){2,5})/g;
function clozeFromText(text,max,src){
  text=text.replace(/\r/g,'').replace(/[ \t]+/g,' ');
  var sents=[];
  text.split(/\n+/).forEach(function(b){
    b=b.trim();if(!b)return;
    b=b.replace(/^(?:[\u2022\u25aa\u25cf\-\*·]|\d{1,3}[\.\)]|[a-z][\.\)])\s+/,'');
    b.replace(/([\.!?;:])\s+(?=[A-ZÁÉÍÓÚÑ¿¡«"\(0-9])/g,'$1\n').split('\n').forEach(function(s){
      s=s.trim();
      if(s.length>=45&&s.length<=320&&s.split(' ').length>=7&&!/^[A-ZÁÉÍÓÚÑ\s\d\.\-]+$/.test(s)&&!/\.{4,}/.test(s))sents.push(s);

  });

  sents.forEach(function(s,i){
    var found=[];
    var m=s.match(RE_NUM);if(m){var t=m[1];found.push({type:'num',term:t});pools.num.push(t);}
    m=s.match(RE_ART);if(m){found.push({type:'art',term:m[1]});pools.art.push(m[1]);}
    var cm,seenCap=false;RE_CAP.lastIndex=0;
    while((cm=RE_CAP.exec(s))){var term=cm[1].trim();var pos=s.indexOf(term);

    var words=s.split(/[\s,;:\(\)«»"]+/).filter(function(w){var c=w.replace(/[\.\?!]/g,'');return c.length>=9&&/^[a-záéíóúñ]+$/.test(c)&&!STOP[noAcc(c)];});
    words.forEach(function(w){pools.word.push(w.replace(/[\.\?!]/g,''));});
    if(words.length){found.push({type:'word',term:words[Math.floor(words.length/2)].replace(/[\.\?!]/g,'')});}
    if(found.length)cands.push({s:s,found:found,i:i});
  });
  var unitOf=function(t){return noAcc(t).replace(/^[\d\.,\s]+/,'').replace(new RegExp('^('+NUMW+')\\s*'),'');};
  var out=[],used={};
  var order=cands.length>max?cands.filter(function(c,k){return k%Math.ceil(cands.length/max)===0;}):cands;
  order=shuffle(order.slice());
  for(var ci=0;ci<order.length&&out.length<max;ci++){
    var c=order[ci];
    var prio={num:0,art:1,cap:2,word:3};
    var f=c.found.slice().sort(function(a,b){return prio[a.type]-prio[b.type]+(Math.random()-.5);})[0];
    var same=pools[f.type].filter(function(x,k,arr){return arr.indexOf(x)===k&&noAcc(x)!==noAcc(f.term)&&noAcc(x).indexOf(noAcc(f.term))<0&&noAcc(f.term).indexOf(noAcc(x))<0;});
    var d=[];
    if(f.type==='num'){
      var u=unitOf(f.term),pref=same.filter(function(x){return unitOf(x)===u;});
      d=shuffle(pref).slice(0,3);
      if(d.length<3){
        var nm=f.term.match(/^\d+/),wm=f.term.match(new RegExp('^('+NUMW+')','i')),rest=f.term.replace(/^(?:\d+|[a-záéíóú ]+?(?=\s(?:d[ií]as|a[ñn]os|meses|semanas|horas|jueces|miembros|folios|copias)))/i,''),vals=[];
        if(nm){var n0=+nm[0];vals=[n0*2,Math.round(n0/2),n0+5,n0+10,n0-5,n0*3,n0+1,n0+2].filter(function(v){return v!==n0&&v>1;}).map(function(v){return v+rest;});}
        else if(wm){var W=['dos','tres','cuatro','cinco','seis','siete','ocho','diez','quince','veinte','treinta'];vals=shuffle(W.filter(function(x){return x!==wm[1].toLowerCase();})).map(function(x){return x+rest;});}
        shuffle(vals).forEach(function(v){if(d.length<3&&d.indexOf(v)<0&&noAcc(v)!==noAcc(f.term))d.push(v);});
      }
      if(d.length<3)shuffle(same).forEach(function(x){if(d.length<3&&d.indexOf(x)<0)d.push(x);});
    }else d=shuffle(same).slice(0,3);
    if(d.length<3)continue;
    if(used[c.s])continue;used[c.s]=1;

    if(blank===c.s)continue;
    var opts=[f.term].concat(d);
    var q=mkQuestion('Completa la frase: «'+blank+'»',opts,0,'Texto original: '+c.s,src,out.length);
    if(q)out.push(q);
  }
  return out;
}

/* Detección del tipo de contenido */
function parseAny(name,text,ext){
  var src=name;
  if(ext==='json'){var j=parseJSONQuestions(text,src);return {kind:'preguntas',qs:j};}
  if(ext==='csv'||ext==='tsv'){var c=parseCSVQuestions(text,src);if(c.length)return {kind:'preguntas',qs:c};}
  var qs=parseQuestionText(text,src);
  if(qs.length>=2)return {kind:'preguntas',qs:qs};
  return {kind:'apuntes',qs:clozeFromText(text,60,src)};
}

/* Lectura de formatos */
function readTextFile(file){
  return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result||''));};fr.onerror=function(){rej(new Error('No se pudo leer el archivo.'));};fr.readAsText(file,'UTF-8');});
}
function readBuffer(file){
  return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(new Error('No se pudo leer el archivo.'));};fr.readAsArrayBuffer(file);});

function u16(b,o){return b[o]|(b[o+1]<<8);}
function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;}

async function inflateRaw(data){
  if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede abrir archivos Word. Guarda el documento como .txt o actualiza el navegador.');

}

  var i=b.length-22;while(i>=0&&u32(b,i)!==0x06054b50)i--;

    var method=u16(b,p+10),csize=u32(b,p+20),nlen=u16(b,p+28),elen=u16(b,p+30),clen=u16(b,p+32),lho=u32(b,p+42);

    if(fname===name){
      var ds=lho+30+u16(b,lho+26)+u16(b,lho+28),data=b.subarray(ds,ds+csize);

function xmlDecode(s){return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,function(_,n){return String.fromCharCode(+n);}).replace(/&amp;/g,'&');}

  var counters={},out=[];
  xml.split(/<\/w:p>/).forEach(function(p){
    var t='',re=/<w:t[^>]*>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br[^>]*\/>/g,m;
    while((m=re.exec(p))){if(m[0].indexOf('<w:tab')===0)t+=' ';else if(m[0].indexOf('<w:br')===0)t+='\n';else t+=xmlDecode(m[1]);}

    if(!np&&/<w:pStyle w:val="(?:ListNumber|Listanumerada)/i.test(p))np=['','<w:ilvl w:val="0"/><w:numId w:val="s"/>'];
    if(np&&!/^\s*(?:\(?[A-Fa-f]|\d{1,3})[\)\.:]/.test(t)){

function loadPdfJs(){
  return new Promise(function(res,rej){
    if(window.pdfjsLib)return res(window.pdfjsLib);

    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    var to=setTimeout(function(){rej(new Error('El lector de PDF tardó demasiado. Revisa tu conexión.'));},20000);
    s.onload=function(){clearTimeout(to);if(!window.pdfjsLib)return rej(new Error('Lector de PDF no disponible.'));window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};

    var pg=await doc.getPage(p),tc=await pg.getTextContent(),line='',y=null;
    tc.items.forEach(function(it){var yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out.push(line);line='';}y=yy;line+=(line&&!/\s$/.test(line)?' ':'')+it.str;});
    if(line)out.push(line);out.push('');

async function handleFiles(files){
  var cat=ui.modal;if(!cat||!files||!files.length)return;
  ui.busy=true;ui.msg='Leyendo archivos…';renderModal();
  var msgs=[];
  for(var i=0;i<files.length;i++){
    var f=files[i],ext=(f.name.split('.').pop()||'').toLowerCase();
    try{
      var text;
      if(ext==='docx')text=await docxText(f);
      else if(ext==='pdf')text=await pdfText(f);
      else if(ext==='doc')throw new Error('El formato .doc antiguo no se puede leer. Guárdalo como .docx o .txt.');
      else text=await readTextFile(f);
      if(!text||text.replace(/\s/g,'').length<20)throw new Error('No se encontró texto legible.');
      var r=parseAny(f.name,text,ext);
      if(!r.qs.length)throw new Error('No se pudieron obtener preguntas. Revisa el formato (ver ayuda abajo).');
      (S.imports[cat]=S.imports[cat]||[]).push({name:f.name,kind:r.kind,n:r.qs.length,t:Date.now(),qs:r.qs});
      msgs.push('✔ '+f.name+': '+r.qs.length+(r.kind==='preguntas'?' preguntas importadas':' preguntas de completar generadas de tus apuntes'));
    }catch(err){msgs.push('✖ '+f.name+': '+(err&&err.message?err.message:'no se pudo leer'));}

}

  var list=files.length?'<ul class="flist">'+files.map(function(f,i){return '<li><span class="fn">'+esc(f.name)+'<small>'+(f.kind==='preguntas'?'Preguntas importadas':'Generadas de apuntes')+' · '+f.qs.length+'</small></span><button class="btn ghost sm" data-action="rmfile" data-id="'+c+'" data-i="'+i+'">Quitar</button></li>';}).join('')+'</ul>':'<p class="muted small">Aún no hay archivos en este tema.</p>';
  var ex='1. ¿En cuántos días hábiles se puede presentar un reclamo administrativo?\na) 10 días\nb) 20 días\nc) 30 días\nd) 60 días\nRespuesta: b\nExplicación: Art. 115 del Código Tributario.';
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet"><div class="sh-h"><h2 id="mt">Archivos · '+esc(ci.name)+'</h2><button class="x" data-action="closemodal" aria-label="Cerrar">✕</button></div>'+
    '<p class="muted">Agrega uno o varios archivos (Word <b>.docx</b>, <b>PDF</b>, <b>TXT</b>, <b>CSV</b> o <b>JSON</b>). Si traen preguntas con opciones y respuesta, se importan tal cual. Si son apuntes o texto corrido, la app arma <b>preguntas de completar</b> automáticamente (revísalas: son automáticas).</p>'+
    '<label class="btn primary big filebtn'+(ui.busy?' dis':'')+'" for="fileIn">Elegir archivos</label><input id="fileIn" type="file" multiple accept=".docx,.pdf,.txt,.md,.csv,.tsv,.json,text/plain,application/pdf,application/json,text/csv" class="sr"'+(ui.busy?' disabled':'')+'>'+
    (ui.msg?'<div class="status" role="status">'+esc(ui.msg).replace(/\n/g,'<br>')+'</div>':'')+
    '<h3>Archivos de este tema</h3>'+list+
    '<details class="help"><summary>Formato para preguntas propias</summary><p class="small">Escribe cada pregunta numerada, con opciones a) b) c) d), una línea <b>Respuesta:</b> y, si quieres, <b>Explicación:</b>. También sirve marcar la correcta con un asterisco (*) al final. En CSV usa columnas: pregunta, a, b, c, d, respuesta, explicacion. En JSON: [{"pregunta":"…","opciones":["…","…"],"correcta":"b","explicacion":"…"}].</p><pre>'+esc(ex)+'</pre><p class="small">Consejo: puedes pedirle a Claude que convierta tus apuntes en preguntas con este formato y luego cargarlas aquí. Los archivos se guardan solo en este dispositivo.</p></details>'+
    '<button class="btn ghost" data-action="closemodal">Listo</button></div></div>';
}
function renderModal(){
  var old=document.querySelector('.modal');if(old)old.remove();
  if(ui.modal){var d=document.createElement('div');d.innerHTML=modalHTML();document.body.appendChild(d.firstChild);document.body.classList.add('noscroll');}
  else document.body.classList.remove('noscroll');
}

/* ---------- Práctica ---------- */
/* Diálogos propios (los cuadros del navegador pueden estar bloqueados en páginas incrustadas) */
function dlg(msg,onOk,okLabel,cancel){ui.dlg={msg:msg,onOk:onOk,ok:okLabel||'Aceptar',cancel:cancel!==false};renderDlg();}
function renderDlg(){
  var old=document.querySelector('.dlg');if(old)old.remove();
  if(!ui.dlg)return;
  var d=document.createElement('div');d.className='dlg';
  d.innerHTML='<div class="dlg-b" role="alertdialog" aria-modal="true"><p>'+esc(ui.dlg.msg)+'</p><div class="nav">'+(ui.dlg.cancel?'<button class="btn ghost" data-action="dlgno">Cancelar</button>':'')+'<button class="btn primary" data-action="dlgyes">'+esc(ui.dlg.ok)+'</button></div></div>';
  document.body.appendChild(d);
}
function startSession(qs,mode){
  if(!qs.length){dlg('No hay preguntas en los temas elegidos. Marca al menos un tema con preguntas.',null,'Entendido',false);return;}
  var p=PROFMAP[S.profile];
  ui.session={items:qs.map(function(q){return {q:q,order:shuffle(range(q.opts.length)),picked:null};}),i:0,mode:mode,profile:S.profile,pname:p.short,deadline:mode==='exam'?Date.now()+qs.length*60000:0,done:false};
  ui.view='quiz';render();window.scrollTo(0,0);startTimer();
}
var timerId=null;
function startTimer(){
  stopTimer();var s=ui.session;if(!s||s.mode!=='exam')return;
  timerId=setInterval(function(){
    var left=Math.max(0,Math.round((s.deadline-Date.now())/1000)),el=document.getElementById('timer');
    if(el)el.textContent=Math.floor(left/60)+':'+('0'+left%60).slice(-2);
    if(left<=0){stopTimer();finish();}
  },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

function quizHTML(){
  var s=ui.session,it=s.items[s.i],q=it.q,n=q.opts.length,ans=it.picked!=null,fb=s.mode==='practice'&&ans,last=s.i===s.items.length-1;
  var answered=s.items.filter(function(x){return x.picked!=null;}).length;
  var opts=it.order.map(function(oi,j){
    var cls='opt';
    if(ans&&s.mode==='practice'){if(oi===q.ans)cls+=' ok';else if(oi===it.picked)cls+=' bad';cls+=' lock';}
    else if(ans&&oi===it.picked)cls+=' sel';
    return '<button class="'+cls+'" data-action="pick" data-j="'+j+'"'+(fb?' disabled':'')+'><span class="ltr">'+LETTERS[j]+'</span><span class="otx">'+optHTML(q,q.opts[oi])+'</span></button>';
  }).join('');
  var timer=s.mode==='exam'?'<span class="timer" title="Tiempo restante">⏱ <b id="timer">'+(function(){var l=Math.max(0,Math.round((s.deadline-Date.now())/1000));return Math.floor(l/60)+':'+('0'+l%60).slice(-2);})()+'</b></span>':'';
  var fbh='';
  if(fb){var okk=it.picked===q.ans;fbh='<div class="fb '+(okk?'good':'bad')+'" role="status"><b>'+(okk?'¡Correcto!':'Incorrecto')+'</b>'+(okk?'':' La respuesta es la '+LETTERS[it.order.indexOf(q.ans)]+'.')+(q.exp?'<p>'+esc(q.exp)+'</p>':'')+'</div>';}
  var dots=s.items.map(function(x,k){var c=x.picked==null?'':(s.mode==='practice'?(x.picked===x.q.ans?' g':' r'):' a');return '<i class="dot'+(k===s.i?' cur':'')+c+'"></i>';}).join('');
  return '<div class="qbar"><button class="btn ghost sm" data-action="quit">Salir</button><span class="qn">'+(s.i+1)+' / '+s.items.length+'</span>'+timer+'</div><div class="pbar"><i style="width:'+Math.round(answered/s.items.length*100)+'%"></i></div>'+
    '<article class="qcard"><div class="qcat">'+esc(catLabel(q.cat))+(q.imp?' · tu archivo':'')+'</div><h2 class="qt">'+qText(q)+'</h2>'+ctxHTML(q)+'<div class="opts'+(q.figopts?' fig':'')+'" role="group" aria-label="Opciones">'+opts+'</div>'+fbh+'</article>'+
    '<div class="nav"><button class="btn ghost" data-action="prev"'+(s.i===0?' disabled':'')+'>← Anterior</button>'+(last?'<button class="btn primary" data-action="finish">Finalizar</button>':'<button class="btn primary" data-action="next">'+(ans||s.mode==='exam'?'Siguiente →':'Omitir →')+'</button>')+'</div><div class="dots" aria-hidden="true">'+dots+'</div>';
}

function finish(){
  stopTimer();var s=ui.session;if(!s||s.done)return;s.done=true;
  var ok=0,total=s.items.length,per={};
  s.items.forEach(function(it){
    var q=it.q,cor=it.picked===q.ans;
    if(it.picked!=null){bump(q.cat,cor);}
    if(cor)ok++;
    var pc=per[q.cat]||(per[q.cat]={ok:0,n:0});pc.n++;if(cor)pc.ok++;
    var wi=-1;S.wrong.forEach(function(w,k){if(w.id===q.id)wi=k;});
    if(it.picked!=null&&!cor){if(wi<0)S.wrong.push(q);}else if(cor&&wi>-1){S.wrong.splice(wi,1);}
  });
  if(S.wrong.length>300)S.wrong=S.wrong.slice(-300);
  var res={t:Date.now(),mode:s.mode,profile:s.profile,pname:s.pname,total:total,ok:ok,pct:pct(ok,total)};
  S.history.push(res);if(S.history.length>40)S.history=S.history.slice(-40);
  saveState();
  ui.result={res:res,per:per,items:s.items};ui.view='results';render();window.scrollTo(0,0);
}
function resultsHTML(){
  var r=ui.result,res=r.res;
  var cls=res.pct>=80?'good':res.pct>=60?'mid':'low';
  var msg=res.pct>=80?'Vas por buen camino: superaste el 80 %.':res.pct>=60?'Buen avance. Refuerza los temas más bajos para llegar al 80 %.':'Sigue practicando: repasa las explicaciones y vuelve a intentar.';
  var per=Object.keys(r.per).map(function(c){var x=r.per[c],p=pct(x.ok,x.n);return '<li><span>'+esc(catLabel(c))+'</span><div class="bar"><i class="'+(p>=80?'good':p>=60?'mid':'low')+'" style="width:'+p+'%"></i></div><b>'+x.ok+'/'+x.n+'</b></li>';}).join('');
  var wrong=r.items.filter(function(it){return it.picked!==it.q.ans;});
  var det=wrong.length?'<section class="card"><h3>Revisión de errores y omitidas ('+wrong.length+')</h3>'+wrong.map(function(it){var q=it.q;return '<div class="rv"><div class="qcat">'+esc(catLabel(q.cat))+'</div><p class="qt s">'+qText(q)+'</p>'+ctxHTML(q)+'<p class="ans"><b>Correcta:</b> <span class="ansx">'+optHTML(q,q.opts[q.ans])+'</span></p>'+(it.picked!=null?'<p class="yours"><b>Tu respuesta:</b> <span class="ansx">'+optHTML(q,q.opts[it.picked])+'</span></p>':'<p class="yours">No respondida</p>')+(q.exp?'<p class="exp">'+esc(q.exp)+'</p>':'')+'</div>';}).join('')+'</section>':'<section class="card"><p>¡Sin errores en este intento!</p></section>';
  return '<header class="top"><h1>Resultado</h1><p>'+esc(res.pname)+' · '+(res.mode==='exam'?'Simulacro':'Práctica')+'</p></header><section class="card score"><div class="big '+cls+'">'+res.pct+' %</div><p><b>'+res.ok+'</b> de <b>'+res.total+'</b> correctas</p><p class="muted">'+msg+'</p></section><section class="card"><h3>Por tema</h3><ul class="per">'+per+'</ul></section>'+det+
    '<div class="nav stack"><button class="btn primary" data-action="home">Volver al inicio</button></div>';
}

/* ---------- Cuestionario de competencias ---------- */
var LK_OPT=['Totalmente en desacuerdo','En desacuerdo','Ni de acuerdo ni en desacuerdo','De acuerdo','Totalmente de acuerdo'];
function likertHTML(){
  var L=ui.lk;
  if(L.i<0)return '<header class="top"><h1>Cuestionario de competencias</h1><p>Autoevaluación sin respuestas correctas</p></header><section class="card"><p>Responde con sinceridad qué tan de acuerdo estás con cada afirmación (40 en total, unos 8 minutos). Al final verás tu perfil en 8 competencias con consejos para reforzarlas.</p><p class="muted small">Es una herramienta de práctica y reflexión, no una prueba psicológica ni un diagnóstico. En pruebas reales conviene responder con naturalidad y coherencia; la sinceridad da resultados más útiles para ti.</p><div class="nav stack"><button class="btn primary big" data-action="lkstart">Comenzar</button><button class="btn ghost" data-action="home">Volver</button></div></section>';
  if(L.i>=LIKERT.length){
    var sc={};COMPS.forEach(function(c){sc[c.id]={s:0,n:0};});
    LIKERT.forEach(function(it,k){var v=L.ans[k];if(v==null)return;if(it[2])v=6-v;sc[it[0]].s+=v;sc[it[0]].n++;});
    var rows=COMPS.map(function(c){var x=sc[c.id],p=x.n?Math.round((x.s/x.n-1)/4*100):0;return {c:c,p:p};});
    S.likert={t:Date.now(),scores:rows.map(function(r){return [r.c.id,r.p];})};saveState();
    var low=rows.slice().sort(function(a,b){return a.p-b.p;}).slice(0,3);
    return '<header class="top"><h1>Tu perfil de competencias</h1><p>Autoevaluación</p></header><section class="card"><ul class="per">'+rows.map(function(r){return '<li><span>'+esc(r.c.name)+'</span><div class="bar"><i class="'+(r.p>=75?'good':r.p>=55?'mid':'low')+'" style="width:'+r.p+'%"></i></div><b>'+r.p+'</b></li>';}).join('')+'</ul><p class="muted small">Escala de 0 a 100. Por encima de 75: fortaleza; de 55 a 75: adecuado; por debajo de 55: conviene reforzar.</p></section><section class="card"><h3>Para reforzar primero</h3>'+low.map(function(r){return '<p><b>'+esc(r.c.name)+':</b> '+esc(r.c.tip)+'</p>';}).join('')+'<p class="muted small">Practica también el tema «Juicio situacional» para entrenar la toma de decisiones en escenarios laborales.</p></section><div class="nav stack"><button class="btn primary" data-action="home">Volver al inicio</button><button class="btn ghost" data-action="lkstart">Repetir</button></div>';
  }
  var it=LIKERT[L.i],cur=L.ans[L.i];
  return '<div class="qbar"><button class="btn ghost sm" data-action="home">Salir</button><span class="qn">'+(L.i+1)+' / '+LIKERT.length+'</span></div><div class="pbar"><i style="width:'+Math.round(L.i/LIKERT.length*100)+'%"></i></div><article class="qcard"><div class="qcat">Autoevaluación</div><h2 class="qt">'+esc(it[1])+'</h2><div class="opts" role="group">'+LK_OPT.map(function(t,j){return '<button class="opt'+(cur===j+1?' sel':'')+'" data-action="lkpick" data-v="'+(j+1)+'"><span class="ltr">'+(j+1)+'</span><span class="otx">'+t+'</span></button>';}).join('')+'</div></article><div class="nav"><button class="btn ghost" data-action="lkprev"'+(L.i===0?' disabled':'')+'>← Anterior</button><span></span></div>';
}

/* ---------- Render ---------- */
function render(){
  if(!$app)$app=document.getElementById('app');
  var html='';
  if(ui.view==='home')html=homeHTML();
  else if(ui.view==='quiz')html=quizHTML();
  else if(ui.view==='results')html=resultsHTML();
  else if(ui.view==='likert')html=likertHTML();
  $app.innerHTML=html;
  renderModal();
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-action]'):null;if(!t)return;
  var a=t.getAttribute('data-action'),id=t.getAttribute('data-id');
  var p=PROFMAP[S.profile];
  if(a==='profile'){S.profile=id;saveState();render();}
  else if(a==='tog'){return;}
  else if(a==='preset'){
    var pr=p.presets.filter(function(x){return x.id===id;})[0];
    if(id==='none')S.sel[S.profile]=[];
    else S.sel[S.profile]=(pr&&pr.cats?pr.cats.slice():p.allCats.filter(hasContent));
    S.sel[S.profile]=S.sel[S.profile].filter(hasContent);saveState();render();
  }
  else if(a==='files'){ui.modal=id;ui.msg='';ui.busy=false;renderModal();}
  else if(a==='closemodal'){ui.modal=null;ui.msg='';render();}
  else if(a==='rmfile'){removeFile(id,+t.getAttribute('data-i'));}
  else if(a==='count'){S.count=id==='all'?'all':+id;saveState();render();}
  else if(a==='mode'){S.mode=id;saveState();render();}
  else if(a==='start'){var cats=selectedCats();startSession(buildQuestions(cats,S.count),S.mode);}
  else if(a==='review'){startSession(shuffle(S.wrong.slice()),'practice');}
  else if(a==='pick'){
    var s=ui.session,it=s.items[s.i],j=+t.getAttribute('data-j');
    if(s.mode==='practice'&&it.picked!=null)return;
    it.picked=it.order[j];render();
  }
  else if(a==='next'){ui.session.i=Math.min(ui.session.items.length-1,ui.session.i+1);render();window.scrollTo(0,0);}
  else if(a==='prev'){ui.session.i=Math.max(0,ui.session.i-1);render();window.scrollTo(0,0);}
  else if(a==='finish'){
    var un=ui.session.items.filter(function(x){return x.picked==null;}).length;
    if(un)dlg('Tienes '+un+' pregunta(s) sin responder. ¿Finalizar de todos modos?',finish,'Finalizar');
    else finish();
  }
  else if(a==='quit'){dlg('¿Salir? Se perderá este intento.',function(){stopTimer();ui.view='home';render();window.scrollTo(0,0);},'Salir');}
  else if(a==='dlgyes'){var f=ui.dlg&&ui.dlg.onOk;ui.dlg=null;renderDlg();if(f)f();}
  else if(a==='dlgno'){ui.dlg=null;renderDlg();}
  else if(a==='home'){stopTimer();ui.view='home';ui.lk=null;render();window.scrollTo(0,0);}
  else if(a==='likert'){ui.lk={i:-1,ans:[]};ui.view='likert';render();window.scrollTo(0,0);}
  else if(a==='lkstart'){ui.lk={i:0,ans:[]};ui.view='likert';render();window.scrollTo(0,0);}
  else if(a==='lkpick'){ui.lk.ans[ui.lk.i]=+t.getAttribute('data-v');ui.lk.i++;render();window.scrollTo(0,0);}
  else if(a==='lkprev'){ui.lk.i=Math.max(0,ui.lk.i-1);render();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-action')==='tog'){
    var sel=selectedCats().slice(),id=t.getAttribute('data-id'),i=sel.indexOf(id);
    if(t.checked&&i<0)sel.push(id);if(!t.checked&&i>-1)sel.splice(i,1);
    S.sel[S.profile]=sel;saveState();render();
  }
  else if(t&&t.id==='fileIn'){var fs=t.files;handleFiles(fs);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}});

/* ---------- Inicio ---------- */
function boot(){loadState();$app=document.getElementById('app');render();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

})();
</script>
</body>
</html>
